<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --card-bg: #141414;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-red: #addedc;
        }
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: var(--text-color); }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS <span class="text-xs text-[#addedc] font-normal tracking-normal ml-2">ADMIN</span></a>
            <nav class="flex items-center space-x-6 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Public Charts</a>
                <a href="index.html" class="text-neutral-300 hover:text-[#addedc]">Main Site</a>
                <button onclick="adminLogout()" class="bg-red-950 text-red-400 hover:bg-red-900 px-4 py-2 rounded-xl text-xs font-bold transition-all uppercase">Logout</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- AUTH CONTAINER -->
        <div id="admin-auth-container" class="max-w-md mx-auto my-20 bg-neutral-900 border border-neutral-800 p-8 rounded-3xl space-y-6">
            <div class="text-center space-y-2">
                <i class="fa-solid fa-lock text-4xl text-[#addedc] mb-2"></i>
                <h1 class="text-2xl font-black uppercase">Admin Portal</h1>
                <p class="text-xs text-neutral-400">Please enter the administrator password to manage site data.</p>
            </div>
            <form onsubmit="handleAdminPageLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-neutral-400 mb-1 font-bold">Password</label>
                    <input type="password" id="admin-page-pass" required class="w-full bg-black border border-neutral-700 px-4 py-3 rounded-xl text-sm text-white focus:outline-none focus:border-[#addedc]">
                </div>
                <div id="admin-auth-error" class="hidden text-red-400 text-xs font-bold text-center">Invalid password. Please try again.</div>
                <button type="submit" class="w-full bg-[#addedc] text-black font-black uppercase py-3 rounded-xl text-sm transition-all hover:opacity-90">Login to Dashboard</button>
            </form>
        </div>

        <!-- DASHBOARD CONTAINER -->
        <div id="admin-dashboard-container" class="hidden space-y-8">
            <!-- Navigation Tabs -->
            <div class="flex flex-wrap gap-3 border-b border-neutral-800 pb-4">
                <button onclick="switchAdminTab('builder')" id="tab-btn-builder" class="bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all">Chart Builder & CSV</button>
                <button onclick="switchAdminTab('songs')" id="tab-btn-songs" class="bg-neutral-800 text-neutral-400 px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all hover:text-white">Master Songs Catalog</button>
            </div>

            <!-- TAB CONTENT AREA -->
            <div id="admin-tab-content"></div>
        </div>
    </main>

    <!-- ADMIN MODAL CONTAINER -->
    <div id="admin-modal-container"></div>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        function checkAuthAndInit() {
            const authContainer = document.getElementById('admin-auth-container');
            const dashboardContainer = document.getElementById('admin-dashboard-container');

            if (sessionStorage.getItem('ukts_admin_auth') === 'true') {
                if (authContainer) authContainer.classList.add('hidden');
                if (dashboardContainer) dashboardContainer.classList.remove('hidden');
                switchAdminTab('builder');
            } else {
                if (authContainer) authContainer.classList.remove('hidden');
                if (dashboardContainer) dashboardContainer.classList.add('hidden');
            }
        }

        function handleAdminPageLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-page-pass').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('ukts_admin_auth', 'true');
                checkAuthAndInit();
                showToast('Logged in successfully!');
            } else {
                document.getElementById('admin-auth-error').classList.remove('hidden');
            }
        }

        function switchAdminTab(tabName) {
            const content = document.getElementById('admin-tab-content');
            const btnBuilder = document.getElementById('tab-btn-builder');
            const btnSongs = document.getElementById('tab-btn-songs');

            if (!content) return;

            if (tabName === 'builder') {
                btnBuilder.className = 'bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all';
                btnSongs.className = 'bg-neutral-800 text-neutral-400 px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all hover:text-white';
                content.innerHTML = renderAdminUploadTab();
            } else if (tabName === 'songs') {
                btnSongs.className = 'bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all';
                btnBuilder.className = 'bg-neutral-800 text-neutral-400 px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all hover:text-white';
                content.innerHTML = renderMasterSongsTab();
            }
        }

        function renderMasterSongsTab() {
            const dbData = getDB();
            const songs = dbData.songs || [];

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
                        <div>
                            <h2 class="text-xl font-bold uppercase">Master Songs Catalog (${songs.length})</h2>
                            <p class="text-xs text-neutral-400">View, edit, or add individual songs to your database.</p>
                        </div>
                        <button onclick="openSongModal()" class="bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase transition-all hover:opacity-90"><i class="fa-solid fa-plus mr-1.5"></i> Add New Song</button>
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
                        <div class="grid grid-cols-[80px_1fr_120px_100px] font-bold text-xs text-neutral-400 px-6 py-3 border-b border-neutral-800 bg-black/40">
                            <div>CODE</div>
                            <div>SONG & ARTIST</div>
                            <div>GENRES</div>
                            <div class="text-right">ACTIONS</div>
                        </div>
                        <div class="divide-y divide-neutral-800/60 max-h-[600px] overflow-y-auto">
                            ${songs.length === 0 ? `<div class="p-8 text-center text-neutral-500">No songs in catalog yet.</div>` : songs.map(song => `
                                <div class="grid grid-cols-[80px_1fr_120px_100px] items-center px-6 py-3 hover:bg-neutral-800/30 transition-colors">
                                    <div class="font-mono text-xs text-[#addedc] font-bold">${song.code || '-'}</div>
                                    <div class="flex items-center gap-3 min-w-0 pr-4">
                                        ${renderSongCover(song, "w-9 h-9 rounded-lg object-cover bg-neutral-800 shrink-0")}
                                        <div class="min-w-0">
                                            <p class="font-bold text-xs truncate text-white">${song.title}</p>
                                            <p class="text-[10px] text-neutral-400 truncate">${formatArtists(song.artist)}</p>
                                        </div>
                                    </div>
                                    <div class="text-xs text-neutral-400 truncate">${(song.genres || []).join(', ')}</div>
                                    <div class="flex justify-end gap-2">
                                        <button onclick="openSongModal('${song.id}')" class="w-7 h-7 bg-neutral-800 hover:bg-neutral-700 text-white rounded-lg inline-flex items-center justify-center text-xs" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button onclick="deleteSong('${song.id}')" class="w-7 h-7 bg-red-950 hover:bg-red-900 text-red-400 rounded-lg inline-flex items-center justify-center text-xs" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
