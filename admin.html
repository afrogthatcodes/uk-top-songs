<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-neutral-300 hover:text-[#addedc]">Artists</a>
                <a href="news.html" class="text-neutral-300 hover:text-[#addedc]">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main id="admin-main" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full"></main>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-sm w-full p-6 space-y-4 text-center">
            <div class="w-12 h-12 rounded-full bg-[#addedc]/10 text-[#addedc] mx-auto flex items-center justify-center text-xl"><i class="fa-solid fa-lock"></i></div>
            <h3 class="text-xl font-bold uppercase text-white">Admin Access</h3>
            <p class="text-xs text-neutral-400">Enter password to access management tools.</p>
            <form onsubmit="handleAdminLoginCustom(event)" class="space-y-3">
                <input type="password" id="admin-pass-input" placeholder="Enter password" autofocus class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-[#addedc]">
                <p id="admin-login-error" class="text-xs text-red-400 hidden">Incorrect password!</p>
                <div class="flex gap-2 pt-2">
                    <a href="index.html" class="w-1/2 bg-neutral-800 text-white py-2.5 rounded-xl text-xs font-bold uppercase flex items-center justify-center">Cancel</a>
                    <button type="submit" class="w-1/2 bg-[#addedc] text-black py-2.5 rounded-xl text-xs font-bold uppercase">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dynamic Modal Container -->
    <div id="admin-modal-container"></div>

    <script src="script.js"></script>
    <script>
        let currentActiveTab = 'songs';
        let currentSearchQuery = '';

        async function checkAuthAndInit() {
            if (typeof fetchDBAsync === 'function') {
                await fetchDBAsync();
            }
            const db = getDB();
            if (isAdminLoggedIn || sessionStorage.getItem('ukts_admin_auth') === 'true') {
                isAdminLoggedIn = true;
                closeAdminLoginModal();
                renderAdminPage(document.getElementById('admin-main'), db);
            } else {
                promptAdminLogin();
            }
        }

        function handleAdminLoginCustom(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                sessionStorage.setItem('ukts_admin_auth', 'true');
                closeAdminLoginModal();
                showToast('Welcome, Admin!');
                const db = getDB();
                renderAdminPage(document.getElementById('admin-main'), db);
            } else {
                document.getElementById('admin-login-error').classList.remove('hidden');
            }
        }

        function renderAdminPage(container, db) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center mb-8 pb-6 border-b border-neutral-800">
                        <div>
                            <span class="bg-[#addedc] text-black text-[10px] font-black uppercase px-3 py-1 rounded-lg inline-block mb-2"><i class="fa-solid fa-lock mr-1"></i> Admin Dashboard</span>
                            <h1 class="text-3xl font-black uppercase tracking-tight">Catalog & Management</h1>
                        </div>
                        <button onclick="adminLogout()" class="bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Logout</button>
                    </div>

                    <div class="flex gap-2 mb-8 border-b border-neutral-900 pb-4 flex-wrap">
                        <button onclick="switchAdminTab('songs')" id="tab-btn-songs" class="admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-[#addedc] text-black">Songs (${db.songs.length})</button>
                        <button onclick="switchAdminTab('artists')" id="tab-btn-artists" class="admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white">Artists</button>
                        <button onclick="switchAdminTab('charts')" id="tab-btn-charts" class="admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white">Chart History</button>
                        <button onclick="switchAdminTab('news')" id="tab-btn-news" class="admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white">News</button>
                        <button onclick="switchAdminTab('upload')" id="tab-btn-upload" class="admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white">Upload & Charts</button>
                    </div>

                    <div id="admin-tab-content">${renderAdminSongsTab(db, currentSearchQuery)}</div>
                </div>
            `;
        }

        function switchAdminTab(tab, query = null) {
            currentActiveTab = tab;
            if (query !== null) currentSearchQuery = query;
            const currentDb = getDB();

            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.className = 'admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white';
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) activeBtn.className = 'admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-[#addedc] text-black';

            const container = document.getElementById('admin-tab-content');
            if (tab === 'songs') container.innerHTML = renderAdminSongsTab(currentDb, currentSearchQuery);
            if (tab === 'artists') container.innerHTML = renderAdminArtistsTab(currentDb, currentSearchQuery);
            if (tab === 'charts') container.innerHTML = renderAdminChartsTab(currentDb, currentSearchQuery);
            if (tab === 'news') container.innerHTML = renderAdminNewsTab(currentDb, currentSearchQuery);
            if (tab === 'upload') container.innerHTML = renderAdminUploadTab();
        }

        function filterCurrentTab(query) {
            currentSearchQuery = query;
            switchAdminTab(currentActiveTab, query);
        }

        // --- SONGS TAB ---
        function renderAdminSongsTab(dbInstance, query = '') {
            const q = query.trim().toLowerCase();
            const filteredSongs = dbInstance.songs.filter(s => 
                s.title.toLowerCase().includes(q) || 
                s.artist.toLowerCase().includes(q) || 
                s.code.toLowerCase().includes(q)
            );

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h3 class="text-xl font-bold uppercase">Master Songs Catalog</h3>
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <input type="text" id="admin-search-input" value="${query}" placeholder="Search songs..." oninput="filterCurrentTab(this.value)" class="w-full sm:w-64 bg-neutral-900 border border-neutral-800 px-4 py-2 rounded-xl text-xs text-white focus:outline-none">
                            <button onclick="openSongModal()" class="bg-[#addedc] text-black px-5 py-2.5 rounded-xl text-xs font-bold uppercase flex items-center gap-2 shrink-0"><i class="fa-solid fa-plus"></i> Add Song</button>
                        </div>
                    </div>
                    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <tr class="border-b border-neutral-800 text-neutral-400 text-xs uppercase font-bold bg-neutral-900/50">
                                <th class="p-4">Cover</th>
                                <th class="p-4">Code</th>
                                <th class="p-4">Title & Artists</th>
                                <th class="p-4">Genres</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                            ${filteredSongs.map(song => `
                                <tr class="border-b border-neutral-800/50 text-sm">
                                    <td class="p-4">${renderSongCover(song, "w-10 h-10 rounded-lg object-cover bg-neutral-800")}</td>
                                    <td class="p-4 font-mono text-neutral-400 text-xs">${song.code}</td>
                                    <td class="p-4 font-bold">${song.title} <span class="block text-xs font-normal text-neutral-400">${song.artist}</span></td>
                                    <td class="p-4">${renderGenreBadges(song)}</td>
                                    <td class="p-4 text-right space-x-2">
                                        <button onclick="openSongModal('${song.id}')" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteSong('${song.id}')" class="bg-red-950 hover:bg-red-900 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
            `;
        }

        // --- ARTISTS TAB ---
        function renderAdminArtistsTab(dbInstance, query = '') {
            const q = query.trim().toLowerCase();
            const artistMap = {};

            dbInstance.songs.forEach(song => {
                if (!song.artist) return;
                const cleaned = song.artist.replace(/;/g, ',').replace(/\bfeat\.?/gi, ',');
                cleaned.split(/,|\&/).map(a => a.trim()).forEach(artistName => {
                    if (!artistName) return;
                    if (!artistMap[artistName]) {
                        artistMap[artistName] = {
                            name: artistName,
                            songCount: 0,
                            image: (dbInstance.artists && dbInstance.artists[artistName]) || song.cover || fallbackCoverSVG
                        };
                    }
                    artistMap[artistName].songCount++;
                });
            });

            const artistsList = Object.values(artistMap).filter(a => a.name.toLowerCase().includes(q));

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h3 class="text-xl font-bold uppercase">Artists Management (${artistsList.length})</h3>
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <input type="text" id="admin-search-input" value="${query}" placeholder="Search artists..." oninput="filterCurrentTab(this.value)" class="w-full sm:w-64 bg-neutral-900 border border-neutral-800 px-4 py-2 rounded-xl text-xs text-white focus:outline-none">
                        </div>
                    </div>
                    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <tr class="border-b border-neutral-800 text-neutral-400 text-xs uppercase font-bold bg-neutral-900/50">
                                <th class="p-4">Artist Image</th>
                                <th class="p-4">Artist Name</th>
                                <th class="p-4">Songs Catalogued</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                            ${artistsList.map(artist => `
                                <tr class="border-b border-neutral-800/50 text-sm">
                                    <td class="p-4"><img src='${artist.image}' class="w-12 h-12 rounded-full object-cover bg-neutral-800"></td>
                                    <td class="p-4 font-bold text-white">${artist.name}</td>
                                    <td class="p-4 text-neutral-400 text-xs">${artist.songCount} song(s)</td>
                                    <td class="p-4 text-right">
                                        <button onclick="openArtistImageModal('${artist.name.replace(/'/g, "\\'")}')" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-pen mr-1"></i> Edit Image</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
            `;
        }

        function openArtistImageModal(artistName) {
            const currentDb = getDB();
            if (!currentDb.artists) currentDb.artists = {};
            const currentImg = currentDb.artists[artistName] || '';

            const modalHTML = `
                <div id="artist-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-md w-full p-6 space-y-4">
                        <div class="flex justify-between items-center"><h3 class="text-xl font-bold uppercase">Edit Artist: ${artistName}</h3><button onclick="closeArtistModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
                        <form onsubmit="handleArtistImageSubmit(event, '${artistName.replace(/'/g, "\\'")}')" class="space-y-3">
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Artist Image URL</label><input type="url" id="artist-image-input" value="${currentImg}" placeholder="https://example.com/image.jpg" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div class="flex justify-end gap-2 pt-3"><button type="button" onclick="closeArtistModal()" class="bg-neutral-800 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold">Save Image</button></div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('admin-modal-container').innerHTML = modalHTML;
        }

        function closeArtistModal() {
            document.getElementById('admin-modal-container').innerHTML = '';
        }

        function handleArtistImageSubmit(e, artistName) {
            e.preventDefault();
            const currentDb = getDB();
            if (!currentDb.artists) currentDb.artists = {};
            const imgUrl = document.getElementById('artist-image-input').value.trim();
            
            if (imgUrl) {
                currentDb.artists[artistName] = imgUrl;
            } else {
                delete currentDb.artists[artistName];
            }

            saveDB(currentDb);
            showToast('Artist image updated!');
            closeArtistModal();
            switchAdminTab('artists');
        }

        // --- CHARTS & NEWS TABS ---
        function renderAdminChartsTab(dbInstance, query = '') {
            return `<div class="p-8 text-center text-neutral-500 bg-neutral-900 rounded-2xl border border-neutral-800">Chart History management view.</div>`;
        }

        function renderAdminNewsTab(dbInstance, query = '') {
            return `<div class="p-8 text-center text-neutral-500 bg-neutral-900 rounded-2xl border border-neutral-800">News Article management view.</div>`;
        }

        // --- UPLOAD & CHART BUILDER TAB ---
        function renderAdminUploadTab() {
            const chartOptions = chartCategories.map(c => `<option value="${c.id}">${c.title} (${c.maxRank} max)</option>`).join('');
            const today = new Date();
            const defaultDateStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;

            return `
                <div class="space-y-8 max-w-4xl">
                    <!-- Mode Switcher Tabs -->
                    <div class="flex gap-2 border-b border-neutral-800 pb-4">
                        <button onclick="switchAdminToolMode('csv')" id="tool-mode-csv-btn" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all">CSV Importer</button>
                        <button onclick="switchAdminToolMode('builder')" id="tool-mode-builder-btn" class="bg-neutral-800 text-neutral-400 px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all hover:text-white">In-Site Chart Builder</button>
                    </div>

                    <!-- CSV Importer Section -->
                    <div id="tool-csv-section" class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-4">
                        <h3 class="text-xl font-bold uppercase">CSV Importer</h3>
                        <p class="text-xs text-neutral-400">
                            <strong>Catalog Mode:</strong> <code class="text-[#addedc]">Title, Artist, Genres, Cover URL, Album</code>.<br>
                            <strong>Chart Mode:</strong> <code class="text-[#addedc]">Rank, Song, Artist, Sales Increase (true/false)</code> or Full 7-column format.
                        </p>

                        <div>
                            <label class="block text-xs uppercase text-neutral-400 mb-1">Upload Mode</label>
                            <select id="csv-upload-type" onchange="toggleUploadModeFields()" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-xs text-white focus:outline-none">
                                <option value="catalog">Master Songs Catalog Import (Songs Only)</option>
                                <option value="chart">Chart Rankings Import (Assign to Chart & Date)</option>
                            </select>
                        </div>

                        <div id="chart-options-container" class="space-y-3 hidden">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs uppercase text-neutral-400 mb-1">Select Chart</label>
                                    <select id="csv-chart-category" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-xs text-white focus:outline-none">
                                        ${chartOptions}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs uppercase text-neutral-400 mb-1">Chart Date (DD/MM/YYYY)</label>
                                    <input type="text" id="csv-chart-date" value="${defaultDateStr}" placeholder="DD/MM/YYYY" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-xs text-white focus:outline-none font-mono">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs uppercase text-neutral-400 mb-1">CSV File</label>
                            <input type="file" id="csv-file-input" accept=".csv" class="w-full bg-black border border-neutral-700 px-4 py-3 rounded-xl text-xs text-white">
                        </div>

                        <button onclick="handleCSVUpload(event)" class="bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase">Import CSV</button>
                    </div>

                    <!-- In-Site Chart Builder Section -->
                    <div id="tool-builder-section" class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-6 hidden">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h3 class="text-xl font-bold uppercase">In-Site Chart Builder</h3>
                                <p class="text-xs text-neutral-400">Build or update weekly charts directly from your master catalog without needing CSVs.</p>
                            </div>
                            <button onclick="saveInteractiveChart()" class="bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase">Save Chart</button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-black/40 p-4 rounded-xl border border-neutral-800">
                            <div>
                                <label class="block text-xs uppercase text-neutral-400 mb-1">Select Chart Category</label>
                                <select id="builder-chart-category" onchange="loadBuilderRows()" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-xs text-white focus:outline-none">
                                    ${chartOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs uppercase text-neutral-400 mb-1">Chart Date (DD/MM/YYYY)</label>
                                <input type="text" id="builder-chart-date" value="${defaultDateStr}" onchange="loadBuilderRows()" placeholder="DD/MM/YYYY" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-xs text-white focus:outline-none font-mono">
                            </div>
                        </div>

                        <div id="builder-rows-container" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                            <!-- Dynamically populated chart rows -->
                        </div>

                        <button onclick="saveInteractiveChart()" class="bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase">Save Chart</button>
                    </div>
                </div>
            `;
        }

        function switchAdminToolMode(mode) {
            const csvBtn = document.getElementById('tool-mode-csv-btn');
            const builderBtn = document.getElementById('tool-mode-builder-btn');
            const csvSection = document.getElementById('tool-csv-section');
            const builderSection = document.getElementById('tool-builder-section');

            if (mode === 'csv') {
                csvBtn.className = 'bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all';
                builderBtn.className = 'bg-neutral-800 text-neutral-400 px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all hover:text-white';
                csvSection.classList.remove('hidden');
                builderSection.classList.add('hidden');
            } else {
                builderBtn.className = 'bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all';
                csvBtn.className = 'bg-neutral-800 text-neutral-400 px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all hover:text-white';
                builderSection.classList.remove('hidden');
                csvSection.classList.add('hidden');
                loadBuilderRows();
            }
        }

        function loadBuilderRows() {
            const container = document.getElementById('builder-rows-container');
            if (!container) return;

            const db = getDB();
            const category = document.getElementById('builder-chart-category')?.value || 'top-songs';
            const dateInput = document.getElementById('builder-chart-date')?.value.trim();
            const catObj = chartCategories.find(c => c.id === category);
            const maxRank = catObj ? catObj.maxRank : 25;

            const existingEntries = (db.chartHistory && db.chartHistory[category] && db.chartHistory[category][dateInput]) || [];
            const sortedSongs = [...(db.songs || [])].sort((a, b) => a.title.localeCompare(b.title));
            const songOptions = `<option value="">-- Select Song from Catalog --</option>` + sortedSongs.map(s => `<option value="${s.id}">${s.title} - ${s.artist} (${s.code})</option>`).join('');

            let rowsHTML = '';
            for (let r = 1; r <= maxRank; r++) {
                const existingItem = existingEntries.find(e => e.rank === r);
                const salesChecked = existingItem && existingItem.salesIncrease ? 'checked' : '';

                rowsHTML += `
                    <div class="flex items-center gap-3 bg-black/60 border border-neutral-800 p-3 rounded-xl">
                        <div class="w-10 text-center font-bold text-sm text-[#addedc]">#${r}</div>
                        <div class="flex-1">
                            <select data-rank-index="${r}" class="builder-song-select w-full bg-neutral-900 border border-neutral-700 px-3 py-2 rounded-lg text-xs text-white focus:outline-none">
                                ${songOptions}
                            </select>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0 px-2">
                            <input type="checkbox" data-rank-sales="${r}" class="builder-sales-checkbox accent-[#addedc] w-4 h-4 rounded cursor-pointer" ${salesChecked}>
                            <span class="text-xs text-neutral-400 uppercase">Sales Inc.</span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = rowsHTML;

            if (existingEntries.length > 0) {
                existingEntries.forEach(item => {
                    const selectEl = container.querySelector(`select[data-rank-index="${item.rank}"]`);
                    if (selectEl) selectEl.value = item.songId;
                });
            }
        }

        function saveInteractiveChart() {
            const db = getDB();
            const category = document.getElementById('builder-chart-category')?.value || 'top-songs';
            const dateInput = document.getElementById('builder-chart-date')?.value.trim();

            if (!dateInput) {
                showToast('Please specify a chart date.');
                return;
            }

            if (!db.chartHistory) db.chartHistory = {};
            if (!db.chartHistory[category]) db.chartHistory[category] = {};

            const container = document.getElementById('builder-rows-container');
            if (!container) return;

            const selects = container.querySelectorAll('.builder-song-select');
            const chartEntries = [];

            selects.forEach(sel => {
                const rank = parseInt(sel.getAttribute('data-rank-index'), 10);
                const songId = sel.value;
                if (songId) {
                    const salesCheckbox = container.querySelector(`input[data-rank-sales="${rank}"]`);
                    const salesIncrease = salesCheckbox ? salesCheckbox.checked : false;

                    chartEntries.push({
                        songId,
                        rank,
                        salesIncrease
                    });
                }
            });

            db.chartHistory[category][dateInput] = chartEntries;
            saveDB(db);
            showToast(`Successfully saved ${chartEntries.length} entries for ${category} (${dateInput})!`);
        }

        function toggleUploadModeFields() {
            const mode = document.getElementById('csv-upload-type')?.value;
            const container = document.getElementById('chart-options-container');
            if (container) {
                if (mode === 'chart') {
                    container.classList.remove('hidden');
                } else {
                    container.classList.add('hidden');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkAuthAndInit();
        });
    </script>
</body>
</html>
