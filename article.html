<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-neutral-300 hover:text-[#addedc]">Artists</a>
                <a href="news.html" class="text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main id="article-main" class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full"></main>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof fetchDBAsync === 'function') {
                await fetchDBAsync();
            }
            const db = getDB();
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const container = document.getElementById('article-main');

            const article = (db.news || []).find(n => n.id === articleId);

            if (!article) {
                container.innerHTML = `
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-12 text-center space-y-4">
                        <h1 class="text-2xl font-black uppercase text-white">Article Not Found</h1>
                        <p class="text-sm text-neutral-400">The news article you are looking for doesn't exist or has been removed.</p>
                        <a href="news.html" class="inline-block bg-[#addedc] text-black px-6 py-2.5 rounded-xl text-xs font-bold uppercase mt-2">Back to News</a>
                    </div>
                `;
                return;
            }

            document.title = `${article.title} - UK TOP SONGS`;

            container.innerHTML = `
                <div class="space-y-8">
                    <a href="news.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-neutral-400 hover:text-[#addedc] transition-colors">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to Latest News</span>
                    </a>

                    <article class="bg-neutral-900/60 border border-neutral-800 rounded-3xl p-6 sm:p-10 space-y-6">
                        <div class="flex items-center justify-between gap-4 border-b border-neutral-800 pb-6">
                            <span class="bg-[#addedc] text-black text-[10px] font-black uppercase px-3 py-1 rounded-md tracking-wider">${article.category}</span>
                            <span class="font-mono text-xs text-neutral-400">${article.date}</span>
                        </div>

                        <h1 class="text-2xl sm:text-4xl font-black text-white leading-tight">${article.title}</h1>

                        <div class="text-neutral-300 text-sm sm:text-base leading-relaxed whitespace-pre-line pt-2">
                            ${article.content}
                        </div>
                    </article>
                </div>
            `;
        });
    </script>
</body>
</html>
