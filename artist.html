<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Artist Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --card-bg: #141414;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-red: #addedc;
        }
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: var(--text-color); }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-white">Artists</a>
                <a href="news.html" class="text-neutral-300 hover:text-[#addedc]">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main id="artist-main" class="flex-grow w-full"></main>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="history-modal-title" class="text-xl font-bold uppercase">Position History</h3>
                <button onclick="closeHistoryModal()"><i class="fa-solid fa-xmark text-xl text-neutral-400 hover:text-white"></i></button>
            </div>
            <div class="relative w-full h-72">
                <canvas id="positionHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ADMIN MODAL CONTAINER -->
    <div id="admin-modal-container"></div>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const urlParams = new URLSearchParams(window.location.search);
        const artistName = urlParams.get('name') || 'Artist';
        const container = document.getElementById('artist-main');
        const isAdmin = sessionStorage.getItem('ukts_admin_auth') === 'true';

        // Fetches tracks sorted correctly by peak position (e.g., #8, #10, #22, #25)
        const artistTracks = getArtistTracksSortedByPeak(artistName, db);

        const adminBanner = isAdmin ? `
            <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl flex justify-between items-center shadow-lg mb-6">
                <span class="text-xs font-bold text-[#addedc] uppercase"><i class="fa-solid fa-shield-halved mr-2"></i> Admin Mode Active</span>
                <a href="admin.html" class="bg-[#addedc] text-black px-4 py-2 rounded-xl text-xs font-bold uppercase transition-all hover:opacity-90">Manage Songs Catalog</a>
            </div>
        ` : '';

        let html = `
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
                ${adminBanner}

                <div class="flex items-center gap-6 bg-neutral-900 border border-neutral-800 p-8 rounded-3xl">
                    <div>
                        <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tight text-white">${artistName}</h1>
                        <p class="text-xs text-neutral-400 mt-1">Artist Profile • ${artistTracks.length} Charted Tracks</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-black uppercase tracking-tight text-white">Top Songs Chart (${artistTracks.length})</h2>
                    
                    <div class="grid grid-cols-[60px_1fr_60px_60px_60px] font-bold text-xs text-neutral-400 px-4 py-2 border-b border-neutral-800">
                        <div>TRACK</div>
                        <div></div>
                        <div class="text-right">PEAK</div>
                        <div class="text-center">WEEKS</div>
                        <div class="text-right">INFO</div>
                    </div>

                    <div class="space-y-2">
                        ${artistTracks.length === 0 ? `<div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">No tracks found for this artist.</div>` : artistTracks.map(song => {
                            const adminControls = isAdmin ? `
                                <div class="flex items-center gap-1 bg-black/60 px-2 py-1 rounded-lg border border-neutral-800 ml-2">
                                    <button onclick="openSongModal('${song.id}')" class="text-neutral-400 hover:text-white px-1 text-xs" title="Edit Song"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick="removeArtistSongDirectly('${song.id}')" class="text-red-400 hover:text-red-300 px-1 text-xs" title="Delete Song"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : '';

                            return `
                                <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4 grid grid-cols-[60px_1fr_60px_60px_60px] items-center gap-4 hover:border-sky-400 transition-colors">
                                    <div class="shrink-0">${renderSongCover(song)}</div>
                                    <div class="min-w-0">
                                        <h3 class="font-bold text-sm truncate text-white">${song.title}</h3>
                                        <p class="truncate text-xs text-neutral-400">${formatArtists(song.artist)}</p>
                                    </div>
                                    <div class="text-right font-black text-white text-sm">${song.peak}</div>
                                    <div class="text-center text-xs font-bold text-neutral-300">${song.weeks}</div>
                                    <div class="text-right flex justify-end items-center">
                                        <button onclick="openHistoryModal('top-songs', 'Top Songs', '${song.id}', '${song.title.replace(/'/g, "\\'")}')" class="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 inline-flex items-center justify-center text-neutral-400 hover:text-white transition-colors">
                                            <i class="fa-solid fa-info text-xs"></i>
                                        </button>
                                        ${adminControls}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = html;

        function removeArtistSongDirectly(songId) {
            if (!confirm('Are you sure you want to delete this song?')) return;
            const dbData = getDB();
            dbData.songs = dbData.songs.filter(s => s.id !== songId);
            saveDB(dbData);
            window.location.reload();
        }
    </script>
</body>
</html>
