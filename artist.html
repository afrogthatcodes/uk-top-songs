<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Artist Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --card-bg: #141414;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --accent-blue: #38bdf8;
            --accent-green: #addedc;
        }
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: var(--text-color); }
        
        .artist-chart-header {
            display: grid;
            grid-template-columns: 60px 1fr 60px 60px 50px;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 16px;
            text-align: center;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .artist-chart-row {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 60px 1fr 60px 60px 50px;
            align-items: center;
            padding: 0 16px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
            height: 65px;
            overflow: hidden;
        }

        .artist-chart-row:hover {
            border-color: var(--accent-blue);
        }

        .first-charted-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
            font-weight: 900;
            text-transform: uppercase;
        }
        .first-charted-day {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
        }
        .first-charted-month {
            font-size: 8px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .first-charted-year {
            font-size: 8px;
            color: var(--text-muted);
        }

        .song-info-col {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 8px;
        }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-neutral-300 hover:text-[#addedc]">Artists</a>
                <a href="news.html" class="text-neutral-300 hover:text-[#addedc]">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main id="artist-main" class="flex-grow w-full"></main>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center"><h3 id="history-modal-title" class="text-xl font-bold uppercase">Position History</h3><button onclick="closeHistoryModal()"><i class="fa-solid fa-xmark text-xl text-neutral-400"></i></button></div>
            <div class="relative w-full h-72"><canvas id="positionHistoryChart"></canvas></div>
        </div>
    </div>

    <!-- ADMIN EDIT MODAL CONTAINER -->
    <div id="admin-modal-container"></div>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const urlParams = new URLSearchParams(window.location.search);
        const artistName = decodeURIComponent(urlParams.get('name') || '');
        const container = document.getElementById('artist-main');

        function parseChartDate(dateStr) {
            if (!dateStr) return new Date(0);
            const [d, m, y] = dateStr.split('/');
            return new Date(`${y}-${m}-${d}`);
        }

        function getSongFirstChartedDate(songId, dbInstance) {
            let earliestDateStr = null;
            let earliestDateObj = null;

            if (!dbInstance.chartHistory) return { dateStr: 'N/A', dateObj: new Date(8640000000000000) };

            for (const catKey in dbInstance.chartHistory) {
                const catDates = dbInstance.chartHistory[catKey];
                for (const dateStr in catDates) {
                    const entries = catDates[dateStr];
                    if (entries.some(e => e.songId === songId)) {
                        const dObj = parseChartDate(dateStr);
                        if (!earliestDateObj || dObj < earliestDateObj) {
                            earliestDateObj = dObj;
                            earliestDateStr = dateStr;
                        }
                    }
                }
            }

            return { 
                dateStr: earliestDateStr || 'N/A', 
                dateObj: earliestDateObj || new Date(8640000000000000) 
            };
        }

        function renderArtistPageFull() {
            const artistSongs = db.songs.filter(s => songHasArtist(s.artist, artistName));
            const artistSongIds = new Set(artistSongs.map(s => s.id));

            const trackPeaks = {};
            let weeksNo1 = 0, weeksTop10 = 0, weeksTop50 = 0, weeksTop75 = 0;

            const songsChartHistory = db.chartHistory['top-songs'] || {};
            Object.values(songsChartHistory).forEach(entriesList => {
                entriesList.forEach(entry => {
                    if (artistSongIds.has(entry.songId)) {
                        const r = entry.rank;
                        if (!trackPeaks[entry.songId] || r < trackPeaks[entry.songId]) {
                            trackPeaks[entry.songId] = r;
                        }
                        if (r === 1) weeksNo1++;
                        if (r <= 10) weeksTop10++;
                        if (r <= 50) weeksTop50++;
                        if (r <= 75) weeksTop75++;
                    }
                });
            });

            let countNo1s = 0, countTop10s = 0, countTop50s = 0, countTop75s = 0;
            Object.values(trackPeaks).forEach(peak => {
                if (peak === 1) countNo1s++;
                if (peak <= 10) countTop10s++;
                if (peak <= 50) countTop50s++;
                if (peak <= 75) countTop75s++;
            });

            const chartsWithSongs = [];
            chartCategories.forEach(cat => {
                const catHistory = db.chartHistory[cat.id] || {};
                const sortedDates = Object.keys(catHistory).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
                const songsInThisChart = [];

                artistSongs.forEach(song => {
                    let peakVal = null;
                    let weeksCount = 0;
                    let rankHistory = [];

                    sortedDates.forEach(dateStr => {
                        const entries = catHistory[dateStr] || [];
                        const match = entries.find(e => e.songId === song.id);
                        if (match) {
                            weeksCount++;
                            rankHistory.push(match.rank);
                            if (peakVal === null || match.rank < peakVal) {
                                peakVal = match.rank;
                            }
                        }
                    });

                    if (weeksCount > 0) {
                        const bestPeakCount = rankHistory.filter(r => r === peakVal).length;
                        const peakDisplay = (peakVal === 1 && bestPeakCount > 1) ? `1×${bestPeakCount}` : `${peakVal}`;
                        
                        const firstChartInfo = getSongFirstChartedDate(song.id, db);

                        songsInThisChart.push({ 
                            song, 
                            peakVal: peakVal === null ? 999 : peakVal,
                            peakDisplay, 
                            weeksCount,
                            firstDateObj: firstChartInfo.dateObj,
                            firstDateStr: firstChartInfo.dateStr
                        });
                    }
                });

                songsInThisChart.sort((a, b) => {
                    if (a.firstDateObj.getTime() !== b.firstDateObj.getTime()) {
                        return a.firstDateObj - b.firstDateObj;
                    }
                    return a.peakVal - b.peakVal;
                });

                if (songsInThisChart.length > 0) {
                    chartsWithSongs.push({
                        chartTitle: cat.title === 'Top Songs' ? 'Top Songs Chart' : `${cat.title} Chart`,
                        rawTitle: cat.title,
                        chartId: cat.id,
                        songs: songsInThisChart
                    });
                }
            });

            const artistImg = db.artists && db.artists[artistName] ? db.artists[artistName].trim() : '';
            const monthsShort = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

            // Get Top 5 Songs for the sidebar preview box
            const topSongsHistory = db.chartHistory['top-songs'] || {};
            const topSongDates = Object.keys(topSongsHistory).sort((a,b) => new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-')));
            const latestTopSongsDate = topSongDates[0] || '';
            const top5Entries = (topSongsHistory[latestTopSongsDate] || []).slice(0, 5);

            const sidebarTop5HTML = `
                <div class="bg-neutral-900/40 border border-neutral-800/80 p-6 rounded-3xl space-y-6">
                    <h3 class="text-base font-black uppercase tracking-wider text-white border-b border-neutral-800 pb-4">
                        Top 5 Songs
                    </h3>
                    <div class="space-y-4">
                        ${top5Entries.length === 0 ? `<p class="text-xs text-neutral-500">No Top 5 available.</p>` : top5Entries.map(entry => {
                            const song = db.songs.find(s => s.id === entry.songId);
                            if (!song) return '';
                            return `
                                <div class="flex items-center gap-3 group">
                                    <span class="text-xs font-black text-[#addedc] w-4">#${entry.rank}</span>
                                    ${renderSongCover(song, "w-12 h-12 rounded-xl object-cover bg-neutral-800 shrink-0 border border-neutral-800")}
                                    <div class="min-w-0">
                                        <h4 class="font-bold text-xs text-white truncate group-hover:text-[#addedc] transition-colors">${song.title}</h4>
                                        <p class="text-[10px] text-neutral-400 truncate mt-0.5">${song.artist}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8 items-start">
                    <div class="space-y-8 min-w-0">
                        <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                            <div>
                                <span class="text-xs font-black uppercase text-[#addedc] tracking-wider">Artist Profile</span>
                                <h1 class="text-3xl sm:text-4xl font-black uppercase text-white mt-1">${artistName}</h1>
                            </div>
                            <div class="flex items-center gap-4">
                                ${artistImg ? `<img src="${artistImg}" alt="${artistName}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover bg-neutral-800 border border-neutral-700/50 shadow-xl" onerror="this.style.display='none';">` : ''}
                                ${isAdminLoggedIn ? `
                                    <button onclick="openEditArtistModal('${artistName.replace(/'/g, "\\'")}')" class="bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase flex items-center gap-2 shrink-0">
                                        <i class="fa-solid fa-pen"></i> Edit Artist
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <div class="bg-neutral-900/60 border border-neutral-800 rounded-3xl p-6">
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-center">
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${countNo1s}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">No. 1s</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${countTop10s}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Top 10s</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${countTop50s}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Top 50s</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${countTop75s}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Top 75s</span></div>
                            </div>
                            <hr class="border-neutral-800/80 my-6">
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-center">
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${weeksNo1}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Weeks at No. 1</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${weeksTop10}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Weeks in Top 10</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${weeksTop50}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Weeks in Top 50</span></div>
                                <div><span class="block text-3xl sm:text-4xl font-black text-[#addedc]">${weeksTop75}</span><span class="text-xs font-bold text-neutral-400 uppercase mt-1 block">Weeks in Top 75</span></div>
                            </div>
                        </div>

                        ${chartsWithSongs.length === 0 ? `
                            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">
                                No chart entries found for this artist.
                            </div>
                        ` : chartsWithSongs.map(chartGroup => `
                            <div class="space-y-4">
                                <h3 class="text-xl font-bold uppercase">${chartGroup.chartTitle} (${chartGroup.songs.length})</h3>
                                <div class="artist-chart-header">
                                    <div></div>
                                    <div></div>
                                    <div>PEAK</div>
                                    <div>WEEKS</div>
                                    <div>INFO</div>
                                </div>
                                <div class="space-y-2">
                                    ${chartGroup.songs.map(({ song, peakDisplay, weeksCount, firstDateStr }) => {
                                        let dayHtml = 'N/A';
                                        let monthHtml = '';
                                        let yearHtml = '';

                                        if (firstDateStr !== 'N/A') {
                                            const [d, m, y] = firstDateStr.split('/');
                                            dayHtml = d;
                                            monthHtml = monthsShort[parseInt(m, 10) - 1];
                                            yearHtml = y;
                                        }

                                        return `
                                            <div class="artist-chart-row">
                                                <div class="first-charted-badge">
                                                    <span class="first-charted-day">${dayHtml}</span>
                                                    <span class="first-charted-month">${monthHtml}</span>
                                                    <span class="first-charted-year">${yearHtml}</span>
                                                </div>
                                                <div class="song-info-col min-w-0">
                                                    ${renderSongCover(song, "w-11 h-11 rounded-lg object-cover bg-neutral-800 shrink-0 border border-neutral-800")}
                                                    <div class="min-w-0">
                                                        <h2 class="font-bold text-sm truncate text-white">${song.title}</h2>
                                                        <p class="truncate text-xs text-neutral-400">${formatArtists(song.artist)}</p>
                                                    </div>
                                                </div>
                                                <div class="text-center text-xs font-bold text-white">${peakDisplay}</div>
                                                <div class="text-center text-xs font-bold text-neutral-300">${weeksCount}</div>
                                                <div class="text-right flex justify-center">
                                                    <button onclick="openHistoryModal('${chartGroup.chartId}', '${chartGroup.rawTitle.replace(/'/g, "\\'")}', '${song.id}', '${song.title.replace(/'/g, "\\'")}')" class="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 inline-flex items-center justify-center text-neutral-400 hover:text-white transition-colors">
                                                        <i class="fa-solid fa-info text-xs"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <aside class="space-y-6 hidden lg:block sticky top-28">
                        ${sidebarTop5HTML}
                    </aside>
                </div>
            `;
        }

        function openEditArtistModal(oldName) {
            const currentDb = getDB();
            const currentImg = currentDb.artists && currentDb.artists[oldName] ? currentDb.artists[oldName] : '';

            const modalHTML = `
                <div id="artist-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-md w-full p-6 space-y-4">
                        <div class="flex justify-between items-center"><h3 class="text-xl font-bold uppercase">Edit Artist</h3><button onclick="closeArtistModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
                        <form onsubmit="handleArtistUpdate(event, '${oldName.replace(/'/g, "\\'")}')" class="space-y-3">
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Artist Name</label><input type="text" id="new-artist-name" value="${oldName}" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Artist Image URL (Leave blank for none)</label><input type="url" id="new-artist-img" value="${currentImg}" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div class="flex justify-end gap-2 pt-3"><button type="button" onclick="closeArtistModal()" class="bg-neutral-800 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold">Save Changes</button></div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('admin-modal-container').innerHTML = modalHTML;
        }

        function closeArtistModal() { document.getElementById('admin-modal-container').innerHTML = ''; }

        function handleArtistUpdate(e, oldName) {
            e.preventDefault();
            const newName = document.getElementById('new-artist-name').value.trim();
            const newImg = document.getElementById('new-artist-img').value.trim();
            if (!newName) return;
            const currentDb = getDB();

            if (!currentDb.artists) currentDb.artists = {};

            if (oldName !== newName) {
                currentDb.songs.forEach(song => {
                    if (song.artist.toLowerCase().includes(oldName.toLowerCase())) {
                        song.artist = song.artist.replace(new RegExp(oldName, 'gi'), newName);
                    }
                });
                if (currentDb.artists[oldName]) {
                    currentDb.artists[newName] = currentDb.artists[oldName];
                    delete currentDb.artists[oldName];
                }
            }

            if (newImg) {
                currentDb.artists[newName] = newImg;
            } else {
                delete currentDb.artists[newName];
            }

            saveDB(currentDb);
            showToast('Artist updated successfully!');
            closeArtistModal();
            window.location.href = `artist.html?name=${encodeURIComponent(newName)}`;
        }

        renderArtistPageFull();
    </script>
    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>
</body>
</html>
