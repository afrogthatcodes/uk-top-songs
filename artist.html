<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Artist Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="index.html" class="text-neutral-300 hover:text-white">Home</a>
                <a href="charts.html" class="text-neutral-300 hover:text-white">Charts</a>
                <a href="news.html" class="text-neutral-300 hover:text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-white">About Us</a>
                <a href="admin.html" class="text-[#addedc]">Admin</a>
            </nav>
        </div>
    </header>

    <main id="artist-main" class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12"></main>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const urlParams = new URLSearchParams(window.location.search);
        const artistName = decodeURIComponent(urlParams.get('name') || '');
        const container = document.getElementById('artist-main');

        const artistSongs = db.songs.filter(s => songHasArtist(s.artist, artistName));

        container.innerHTML = `
            <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl mb-8">
                <span class="text-xs font-black uppercase text-[#addedc]">Artist Profile</span>
                <h1 class="text-3xl sm:text-4xl font-black uppercase mt-1">${artistName}</h1>
            </div>
            <div class="space-y-4">
                <h3 class="text-xl font-bold uppercase">Songs (${artistSongs.length})</h3>
                <div class="space-y-2">
                    ${artistSongs.map(song => `
                        <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl flex items-center gap-4">
                            <img src="${song.cover}" class="w-12 h-12 rounded-lg object-cover">
                            <div><h4 class="font-bold">${song.title}</h4><p class="text-xs text-neutral-400">${song.artist}</p></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    </script>
</body>
</html>
