<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Charts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }
        .chart-table-header { display: grid; grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px; font-weight: 700; font-size: 12px; color: #a3a3a3; padding: 8px 16px; text-align: center; border-bottom: 1px solid #262626; }
        .chart-row { background: #141414; border-radius: 10px; margin-bottom: 8px; display: grid; grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px; align-items: center; padding: 10px 16px; border: 1px solid #262626; }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="index.html" class="text-neutral-300 hover:text-white">Home</a>
                <a href="charts.html" class="text-white">Charts</a>
                <a href="news.html" class="text-neutral-300 hover:text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-white">About Us</a>
                <a href="admin.html" class="text-[#addedc]">Admin</a>
            </nav>
        </div>
    </header>

    <main id="charts-main" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"></main>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center"><h3 id="history-modal-title" class="text-xl font-bold uppercase">Position History</h3><button onclick="closeHistoryModal()"><i class="fa-solid fa-xmark text-xl text-neutral-400"></i></button></div>
            <div class="relative w-full h-72"><canvas id="positionHistoryChart"></canvas></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const urlParams = new URLSearchParams(window.location.search);
        const chartId = urlParams.get('chart') || 'top-songs';
        const container = document.getElementById('charts-main');

        if (!urlParams.get('chart')) {
            container.innerHTML = `
                <div class="space-y-12">
                    <div class="text-center max-w-2xl mx-auto"><h1 class="text-4xl sm:text-5xl font-black uppercase">Charts</h1></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${chartCategories.map(cat => `
                            <a href="charts.html?chart=${cat.id}" class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl flex flex-col justify-between hover:border-neutral-600">
                                <div><span class="text-[10px] font-black uppercase text-[#addedc]">${cat.subtitle}</span><h3 class="text-xl font-black uppercase mt-1">${cat.title}</h3></div>
                                <div class="flex items-center justify-between mt-6 text-xs font-bold text-neutral-400 uppercase"><span>View Chart</span><i class="fa-solid fa-arrow-right text-[#addedc]"></i></div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        } else {
            const currentChart = chartCategories.find(c => c.id === chartId) || chartCategories[0];
            const historyObj = db.chartHistory[currentChart.id] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            let latestDate = dates[dates.length - 1] || '18/09/2026';
            const entries = historyObj[latestDate] || [];

            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6">
                    <h1 class="text-2xl font-bold">${currentChart.title} (${latestDate})</h1>
                    <div class="chart-table-header"><div></div><div></div><div></div><div>LW</div><div>PEAK</div><div>WEEKS</div><div>INFO</div></div>
                    <div class="space-y-2">
                        ${entries.map(entry => {
                            const song = db.songs.find(s => s.id === entry.songId) || { title: 'Unknown', artist: 'Unknown' };
                            return `
                                <div class="chart-row">
                                    <div class="text-center font-black text-xl">${entry.rank}</div>
                                    <div class="flex items-center gap-3"><img src="${song.cover}" class="w-10 h-10 rounded-lg object-cover"><div><h2 class="font-bold text-sm">${song.title}</h2><p class="text-xs text-neutral-400">${formatArtists(song.artist)}</p></div></div>
                                    <div></div><div class="text-center">-</div><div class="text-center">${entry.rank}</div><div class="text-center">1</div>
                                    <div class="text-center"><button onclick="openHistoryModal('${currentChart.id}', '${entry.songId}', '${song.title}')" class="w-7 h-7 rounded-full bg-neutral-800 text-neutral-400"><i class="fa-solid fa-info text-xs"></i></button></div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
