<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Charts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --card-bg: #141414;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-red: #addedc;
        }
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: var(--text-color); }
        
        .chart-table-header {
            display: grid;
            grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 16px;
            text-align: center;
            letter-spacing: 0.5px;
            position: sticky;
            top: 80px;
            background-color: #000000;
            z-index: 40;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-row {
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px;
            align-items: center;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .chart-row:hover {
            border-color: var(--accent-blue);
        }

        .rank-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .song-info-col {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 8px;
        }

        .sales-star {
            font-size: 18px;
            color: var(--accent-gold);
            cursor: pointer;
            user-select: none;
            position: relative;
            text-align: center;
        }

        .sales-star:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .tooltip {
            visibility: hidden;
            width: 160px;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-align: center;
            border-radius: 6px;
            padding: 6px 8px;
            position: absolute;
            z-index: 10;
            bottom: 130%;
            left: 50%;
            margin-left: -80px;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="index.html" class="text-neutral-300 hover:text-white">Home</a>
                <a href="charts.html" class="text-white">Charts</a>
                <a href="news.html" class="text-neutral-300 hover:text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-white">About Us</a>
                <a href="admin.html" class="text-[#addedc]">Admin</a>
            </nav>
        </div>
    </header>

    <main id="charts-main" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full"></main>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="history-modal-title" class="text-xl font-bold uppercase">Position History</h3>
                <button onclick="closeHistoryModal()"><i class="fa-solid fa-xmark text-xl text-neutral-400 hover:text-white"></i></button>
            </div>
            <div class="relative w-full h-72">
                <canvas id="positionHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const urlParams = new URLSearchParams(window.location.search);
        const chartId = urlParams.get('chart');
        const selectedDateParam = urlParams.get('date');
        const container = document.getElementById('charts-main');

        function handleDropdownChange(type, value) {
            if (type === 'main') {
                const genreSelect = document.getElementById('genre-charts-select');
                if (genreSelect) genreSelect.selectedIndex = 0;
            } else {
                const mainSelect = document.getElementById('main-charts-select');
                if (mainSelect) mainSelect.selectedIndex = 0;
            }
            window.location.href = `charts.html?chart=${value}`;
        }

        if (!chartId) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto space-y-12 w-full">
                    <div class="text-center max-w-2xl mx-auto"><h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">Charts</h1></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${chartCategories.map(cat => `
                            <a href="charts.html?chart=${cat.id}" class="bg-neutral-900 border border-neutral-800 hover:border-neutral-600 p-6 rounded-2xl flex flex-col justify-between transition-all group">
                                <div>
                                    <span class="text-[10px] font-black uppercase text-[#addedc] tracking-wider">${cat.subtitle}</span>
                                    <h3 class="text-xl font-black uppercase text-white mt-1 group-hover:text-[#addedc] transition-colors">${cat.title}</h3>
                                </div>
                                <div class="flex items-center justify-between mt-6 text-xs font-bold text-neutral-400 uppercase">
                                    <span>View Chart</span>
                                    <i class="fa-solid fa-arrow-right text-neutral-500 group-hover:text-[#addedc] group-hover:translate-x-1 transition-all"></i>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        } else {
            container.className = "flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full";
            const currentChart = chartCategories.find(c => c.id === chartId) || chartCategories[0];
            const historyObj = db.chartHistory[currentChart.id] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            
            let latestDate = dates[dates.length - 1] || '18/09/2026';
            if (selectedDateParam && historyObj[selectedDateParam]) latestDate = selectedDateParam;

            const currentDatesIndex = dates.indexOf(latestDate);
            const prevDate = currentDatesIndex > 0 ? dates[currentDatesIndex - 1] : null;
            let currentEntries = historyObj[latestDate] || [];
            currentEntries.sort((a, b) => a.rank - b.rank);

            const [dStr, mStr, yStr] = latestDate.split('/');
            const startDateObj = new Date(`${yStr}-${mStr}-${dStr}`);
            const endDateObj = new Date(startDateObj);
            endDateObj.setDate(startDateObj.getDate() + 6);
            const monthsNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dateRangeText = `${startDateObj.getDate()} ${monthsNames[startDateObj.getMonth()]} ${startDateObj.getFullYear()} – ${endDateObj.getDate()} ${monthsNames[endDateObj.getMonth()]} ${endDateObj.getFullYear()}`;
            const isoDateStr = `${yStr}-${mStr}-${dStr}`;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-center">
                        <div onclick="document.getElementById('native-date-picker').showPicker ? document.getElementById('native-date-picker').showPicker() : document.getElementById('native-date-picker').focus()" class="bg-neutral-900 border border-neutral-800 hover:border-neutral-600 cursor-pointer rounded-full px-5 py-2 w-52 justify-between flex items-center shadow-xl relative">
                            <button type="button" onclick="event.stopPropagation(); navigateChartDate('${currentChart.id}', -1, '${latestDate}')" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                            <div class="flex items-center gap-2 text-sky-400 font-bold text-xs"><span>${latestDate}</span><i class="fa-regular fa-calendar text-xs"></i></div>
                            <button type="button" onclick="event.stopPropagation(); navigateChartDate('${currentChart.id}', 1, '${latestDate}')" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            <input type="date" id="native-date-picker" value="${isoDateStr}" onchange="handleDateInputPick('${currentChart.id}', this.value)" class="absolute inset-0 opacity-0 pointer-events-none">
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-neutral-900/60 border border-neutral-800/80 p-5 rounded-2xl backdrop-blur-md">
                        <div>
                            <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight">${currentChart.title}</h1>
                            <p class="text-xs text-neutral-400 mt-0.5">${dateRangeText}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-2.5 w-full md:w-auto">
                            <div class="relative w-full sm:w-44">
                                <select id="main-charts-select" onchange="handleDropdownChange('main', this.value)" class="w-full bg-neutral-900 border border-neutral-700 text-white text-xs font-semibold px-3 py-2 rounded-xl focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Main Charts</option>
                                    <option value="top-songs">Top Songs</option>
                                    <option value="top-albums">Top Albums</option>
                                    <option value="top-artists">Top Artists</option>
                                    <option value="greatest-hits">Greatest Hits</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                            <div class="relative w-full sm:w-48">
                                <select id="genre-charts-select" onchange="handleDropdownChange('genre', this.value)" class="w-full bg-neutral-900 border border-neutral-700 text-white text-xs font-semibold px-3 py-2 rounded-xl focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Genre Charts</option>
                                    <option value="top-afrobeats">Afrobeats Songs</option>
                                    <option value="top-dance">Dance/Electronic Songs</option>
                                    <option value="top-folk-country">Folk/Country Songs</option>
                                    <option value="top-indie-rock">Indie/Rock Songs</option>
                                    <option value="top-rap">Rap Songs</option>
                                    <option value="top-rnb">Rnb/Funk Songs</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="chart-table-header"><div></div><div></div><div></div><div>LW</div><div>PEAK</div><div>WEEKS</div><div>INFO</div></div>

                    <div class="space-y-2">
                        ${currentEntries.length === 0 ? `<div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">No chart entries found for this date (${latestDate}).</div>` : currentEntries.map(entry => {
                            const song = db.songs.find(s => s.id === entry.songId) || { title: 'Unknown', artist: 'Unknown', cover: '' };
                            let lwVal = '-';
                            let peakVal = entry.rank;
                            let weeksCount = 0;
                            let rankHistory = [];

                            for (let i = 0; i <= currentDatesIndex && i < dates.length; i++) {
                                const match = db.chartHistory[currentChart.id][dates[i]].find(e => e.songId === entry.songId);
                                if (match) {
                                    weeksCount++;
                                    rankHistory.push(match.rank);
                                    if (match.rank < peakVal) peakVal = match.rank;
                                }
                            }
                            const bestPeakCount = rankHistory.filter(r => r === peakVal).length;
                            const peakDisplay = (peakVal === 1 && bestPeakCount > 1) ? `1×${bestPeakCount}` : `${peakVal}`;

                            let hasPrevious = rankHistory.length > 1;
                            let trendHTML = !hasPrevious ? '<span class="text-amber-400 text-[10px] font-black uppercase tracking-wider">NEW</span>' : '-';
                            if (prevDate) {
                                const prevMap = (historyObj[prevDate] || []).reduce((acc, cur) => { acc[cur.songId] = cur.rank; return acc; }, {});
                                if (prevMap[entry.songId] !== undefined) {
                                    lwVal = prevMap[entry.songId];
                                    const diff = lwVal - entry.rank;
                                    if (diff > 0) trendHTML = `<span class="text-emerald-500 text-[10px] font-bold flex items-center justify-center gap-0.5"><i class="fa-solid fa-arrow-up text-[9px]"></i> ${diff}</span>`;
                                    else if (diff < 0) trendHTML = `<span class="text-red-500 text-[10px] font-bold flex items-center justify-center gap-0.5"><i class="fa-solid fa-arrow-down text-[9px]"></i> ${Math.abs(diff)}</span>`;
                                    else trendHTML = '<span class="text-neutral-500 font-bold">-</span>';
                                }
                            }

                            return `
                                <div class="chart-row">
                                    <div class="rank-col">
                                        <span class="text-xl font-black text-white block">${entry.rank}</span>
                                        <span>${trendHTML}</span>
                                    </div>
                                    <div class="song-info-col min-w-0">
                                        <img src="${song.cover}" class="w-10 h-10 rounded-lg object-cover bg-neutral-800 shrink-0" onerror="this.src='https://placehold.co/100x100/222/fff?text=Song'">
                                        <div class="min-w-0">
                                            <h2 class="font-bold text-sm truncate text-white">${song.title}</h2>
                                            <p class="truncate text-xs text-neutral-400">${formatArtists(song.artist)}</p>
                                        </div>
                                    </div>
                                    <div class="text-center">${entry.salesIncrease ? `<span class="sales-star">★<span class="tooltip">Song increased in sales this week</span></span>` : ''}</div>
                                    <div class="text-center text-xs font-bold text-neutral-300">${lwVal}</div>
                                    <div class="text-center text-xs font-bold text-white">${peakDisplay}</div>
                                    <div class="text-center text-xs font-bold text-neutral-300">${weeksCount}</div>
                                    <div class="text-right flex justify-center">
                                        <button onclick="openHistoryModal('${currentChart.id}', '${entry.songId}', '${song.title.replace(/'/g, "\\'")}')" class="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 inline-flex items-center justify-center text-neutral-400 hover:text-white transition-colors">
                                            <i class="fa-solid fa-info text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function navigateChartDate(chartId, direction, currentDateStr) {
            const historyObj = db.chartHistory[chartId] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            let idx = dates.indexOf(currentDateStr);
            if (idx + direction >= 0 && idx + direction < dates.length) {
                window.location.href = `charts.html?chart=${chartId}&date=${encodeURIComponent(dates[idx + direction])}`;
            }
        }

        function handleDateInputPick(chartId, isoDateValue) {
            if (!isoDateValue) return;
            const [y, m, d] = isoDateValue.split('-');
            const clicked = new Date(y, m - 1, d);
            const historyObj = db.chartHistory[chartId] || {};
            const dates = Object.keys(historyObj);
            if (dates.length === 0) return;
            let closest = dates[0];
            let minDiff = Math.abs(clicked - new Date(closest.split('/').reverse().join('-')));
            dates.forEach(dt => {
                const diff = Math.abs(clicked - new Date(dt.split('/').reverse().join('-')));
                if (diff < minDiff) { minDiff = diff; closest = dt; }
            });
            window.location.href = `charts.html?chart=${chartId}&date=${encodeURIComponent(closest)}`;
        }
    </script>
</body>
</html>
