<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Albert Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Chart.js for History Graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Albert Sans', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#000000', red: '#addedc', dark: '#0a0a0a', card: '#141414', border: '#262626' }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --card-bg: #141414;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-muted: #a3a3a3;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-red: #addedc;
        }
        body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: var(--text-color); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        .chart-table-header {
            display: grid;
            grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 16px;
            text-align: center;
            letter-spacing: 0.5px;
            position: sticky;
            top: 80px;
            background-color: #000000;
            z-index: 40;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-row {
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 60px 1fr 50px 50px 60px 50px 50px;
            align-items: center;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .chart-row:hover {
            border-color: var(--accent-blue);
        }

        .rank-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .song-info-col {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 8px;
        }

        .sales-star {
            font-size: 18px;
            color: var(--accent-gold);
            cursor: pointer;
            user-select: none;
            position: relative;
            text-align: center;
        }

        .sales-star:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .tooltip {
            visibility: hidden;
            width: 160px;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-align: center;
            border-radius: 6px;
            padding: 6px 8px;
            position: absolute;
            z-index: 10;
            bottom: 130%;
            left: 50%;
            margin-left: -80px;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased selection:bg-[#addedc] selection:text-black">

    <!-- HEADER -->
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#home" onclick="router('home')" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc] transition-colors">
                UK TOP SONGS
            </a>
            
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="#home" onclick="router('home')" class="nav-link text-neutral-300 hover:text-white transition-colors">Home</a>
                <a href="#charts" onclick="router('charts')" class="nav-link text-neutral-300 hover:text-white transition-colors">Charts</a>
                <a href="#news" onclick="router('news')" class="nav-link text-neutral-300 hover:text-white transition-colors">News</a>
                <a href="#about" onclick="router('about')" class="nav-link text-neutral-300 hover:text-white transition-colors">About Us</a>
                <a href="#admin" onclick="router('admin')" class="nav-link text-[#addedc] hover:text-[#bde1ee] transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-xs"></i> Admin
                </a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="main-content" class="flex-grow"></main>

    <!-- FOOTER -->
    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="pt-8 text-neutral-500 text-xs leading-relaxed flex items-center justify-center">
                <span>Thank you for visiting :)</span>
            </div>
        </div>
    </footer>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="history-modal-title" class="text-xl font-bold uppercase">Position History</h3>
                <button onclick="closeHistoryModal()"><i class="fa-solid fa-xmark text-xl text-neutral-400 hover:text-white"></i></button>
            </div>
            <div class="relative w-full h-72">
                <canvas id="positionHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- APP LOGIC -->
    <script>
        const chartCategories = [
            { id: 'top-songs', title: 'Top Songs', subtitle: 'Singles Chart', maxRank: 75 },
            { id: 'top-albums', title: 'Top Albums', subtitle: 'Albums Chart', maxRank: 25 },
            { id: 'top-artists', title: 'Top Artists', subtitle: 'Artists Chart', maxRank: 25 },
            { id: 'greatest-hits', title: 'Greatest Hits', subtitle: 'Compilation Chart', maxRank: 25 },
            { id: 'top-afrobeats', title: 'Top Afrobeats Songs', subtitle: 'Genre Chart', maxRank: 25 },
            { id: 'top-dance', title: 'Top Dance/Electronic Songs', subtitle: 'Genre Chart', maxRank: 25 },
            { id: 'top-folk-country', title: 'Top Folk/Country Songs', subtitle: 'Genre Chart', maxRank: 25 },
            { id: 'top-indie-rock', title: 'Top Indie/Rock Songs', subtitle: 'Genre Chart', maxRank: 25 },
            { id: 'top-rap', title: 'Top Rap Songs', subtitle: 'Genre Chart', maxRank: 25 },
            { id: 'top-rnb', title: 'Top R&B Songs', subtitle: 'Genre Chart', maxRank: 25 }
        ];

        const defaultData = {
            genres: ['Afrobeats', 'Dance/Electronic', 'Folk/Country', 'Indie/Rock', 'Pop', 'Rap', 'Rnb/Funk'],
            songs: [
                { id: '1', code: 'REIN-01', title: 'Rein Me In', artist: 'Sam Fender & Olivia Dean', genres: ['Indie/Rock'], cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=80' },
                { id: '2', code: 'MAN-02', title: 'Man I Need', artist: 'Olivia Dean', genres: ['Rnb/Funk'], cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop&q=80' },
                { id: '3', code: 'GREAT-03', title: 'Great Expectation', artist: 'SIENNA SPIRO', genres: ['Pop'], cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&auto=format&fit=crop&q=80' },
                { id: '4', code: 'CHOOS-04', title: "Choosin' Texas", artist: 'Ella Langley', genres: ['Folk/Country'], cover: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=100&auto=format&fit=crop&q=80' },
                { id: '5', code: 'STUP-05', title: 'stupid song', artist: 'Olivia Rodrigo', genres: ['Pop'], cover: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=100&auto=format&fit=crop&q=80' }
            ],
            chartHistory: {
                'top-songs': {
                    '18/09/2026': [
                        { songId: '1', rank: 1, salesIncrease: false },
                        { songId: '2', rank: 2, salesIncrease: true },
                        { songId: '3', rank: 3, salesIncrease: false },
                        { songId: '4', rank: 4, salesIncrease: false },
                        { songId: '5', rank: 5, salesIncrease: true }
                    ]
                }
            },
            news: [
                { id: '1', title: 'Charts update: New milestones reached this week', category: 'Latest News', date: 'Sept 18, 2026', content: 'Check out the latest movements across the official UK charts.' }
            ]
        };

        function getSongGenres(song) {
            if (song.genres && Array.isArray(song.genres)) return song.genres;
            if (song.genre) return [song.genre];
            return ['Pop'];
        }

        function renderGenreBadges(song) {
            const genres = getSongGenres(song);
            return genres.map(g => `<span class="bg-neutral-800 px-2.5 py-1 rounded-full text-xs inline-block mr-1 mb-1">${g}</span>`).join('');
        }

        function songHasArtist(artistString, targetArtist) {
            if (!artistString) return false;
            const cleaned = artistString.replace(/;/g, ',').replace(/\bfeat\.?/gi, ',');
            const artists = cleaned.split(/,|\&/).map(a => a.trim().toLowerCase());
            const target = targetArtist.trim().toLowerCase();
            return artists.includes(target);
        }

        function formatArtists(artistString) {
            if (!artistString) return '';
            
            const makeLink = (name) => `<a href="#artist/${encodeURIComponent(name)}" onclick="router('artist', '${encodeURIComponent(name)}')" class="hover:text-white transition-colors">${name}</a>`;

            const cleanedString = artistString.replace(/;/g, ',');

            if (cleanedString.toLowerCase().includes('feat.')) {
                const parts = cleanedString.split(/feat\./i).map(a => a.trim()).filter(Boolean);
                const primaryPart = parts[0];
                const primaryArtists = primaryPart.split(',').map(a => a.trim()).filter(Boolean);
                
                const featuredPart = parts.slice(1).join(' ');
                const featuredArtists = featuredPart.split(/&|,/).map(a => a.trim()).filter(Boolean);
                
                let formattedPrimary = '';
                if (primaryArtists.length === 1) {
                    formattedPrimary = makeLink(primaryArtists[0]);
                } else {
                    const lastPrimary = primaryArtists.pop();
                    formattedPrimary = `${primaryArtists.map(a => makeLink(a)).join(', ')} & ${makeLink(lastPrimary)}`;
                }

                if (featuredArtists.length === 0) {
                    return formattedPrimary;
                } else if (featuredArtists.length === 1) {
                    return `${formattedPrimary} feat. ${makeLink(featuredArtists[0])}`;
                } else {
                    const lastFeat = featuredArtists.pop();
                    return `${formattedPrimary} feat. ${featuredArtists.map(a => makeLink(a)).join(', ')} & ${makeLink(lastFeat)}`;
                }
            } 
            
            let artists = cleanedString.split(',').map(a => a.trim()).filter(Boolean);

            if (artists.length === 1) {
                return makeLink(artists[0]);
            } else if (artists.length === 2) {
                return `${makeLink(artists[0])} & ${makeLink(artists[1])}`;
            } else {
                const lastArtist = artists.pop();
                return `${artists.map(a => makeLink(a)).join(', ')} & ${makeLink(lastArtist)}`;
            }
        }

        function getDB() {
            const data = localStorage.getItem('uk_top_songs_db_v4');
            if (!data) {
                localStorage.setItem('uk_top_songs_db_v4', JSON.stringify(defaultData));
                return defaultData;
            }
            const parsed = JSON.parse(data);
            if (!parsed.genres) {
                parsed.genres = defaultData.genres;
            }
            return parsed;
        }

        function saveDB(data) {
            localStorage.setItem('uk_top_songs_db_v4', JSON.stringify(data));
        }

        function router(route, param, dateParam) {
            let hashVal = param ? `${route}/${param}` : route;
            if (dateParam) hashVal += `?date=${dateParam}`;
            window.location.hash = `#${hashVal}`;

            const main = document.getElementById('main-content');
            const db = getDB();

            if (route === 'home') renderHomePage(main, db);
            else if (route === 'charts') {
                if (param) renderChartsPage(main, db, param, dateParam);
                else renderChartsOverviewPage(main, db);
            }
            else if (route === 'artist') renderArtistPage(main, db, decodeURIComponent(param));
            else if (route === 'news') renderNewsPage(main, db);
            else if (route === 'about') renderAboutPage(main);
            else if (route === 'admin') renderAdminPage(main, db);
            else renderHomePage(main, db);
        }

        window.addEventListener('hashchange', () => {
            const fullHash = window.location.hash.substring(1);
            const [pathPart, queryPart] = fullHash.split('?');
            const [route, param] = pathPart.split('/');
            
            let dateParam = null;
            if (queryPart) {
                const params = new URLSearchParams(queryPart);
                dateParam = params.get('date');
            }

            const main = document.getElementById('main-content');
            const db = getDB();

            if (route === 'home') renderHomePage(main, db);
            else if (route === 'charts') {
                if (param) renderChartsPage(main, db, param, dateParam);
                else renderChartsOverviewPage(main, db);
            }
            else if (route === 'artist') renderArtistPage(main, db, decodeURIComponent(param));
            else if (route === 'news') renderNewsPage(main, db);
            else if (route === 'about') renderAboutPage(main);
            else if (route === 'admin') renderAdminPage(main, db);
            else renderHomePage(main, db);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const fullHash = window.location.hash.substring(1);
            if (fullHash) {
                const [pathPart, queryPart] = fullHash.split('?');
                const [route, param] = pathPart.split('/');
                let dateParam = null;
                if (queryPart) {
                    const params = new URLSearchParams(queryPart);
                    dateParam = params.get('date');
                }
                router(route, param, dateParam);
            } else {
                router('home');
            }
        });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 bg-[#addedc] text-black px-6 py-3 rounded-xl font-bold shadow-2xl z-50 text-sm';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Modal and Chart Functions
        function openHistoryModal(chartId, songId, songTitle) {
            const db = getDB();
            const modal = document.getElementById('history-modal');
            const titleEl = document.getElementById('history-modal-title');
            
            titleEl.textContent = `${songTitle} - Position History`;
            modal.classList.remove('hidden');

            const historyObj = db.chartHistory[chartId] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            
            const chartLabels = [];
            const chartRanks = [];

            dates.forEach(dateStr => {
                const entries = historyObj[dateStr] || [];
                const match = entries.find(e => e.songId === songId);
                if (match) {
                    chartLabels.push(dateStr);
                    chartRanks.push(match.rank);
                }
            });

            const ctx = document.getElementById('positionHistoryChart').getContext('2d');
            
            if (window.myPositionChart) {
                window.myPositionChart.destroy();
            }

            window.myPositionChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Chart Position',
                        data: chartRanks,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (evt, activeElements) => {
                        if (activeElements && activeElements.length > 0) {
                            const index = activeElements[0].index;
                            const selectedDate = chartLabels[index];
                            if (selectedDate) {
                                closeHistoryModal();
                                router('charts', chartId, selectedDate);
                            }
                        }
                    },
                    scales: {
                        y: {
                            reverse: true,
                            min: 1,
                            max: 75,
                            ticks: {
                                stepSize: 5,
                                callback: function(value) {
                                    if (value === 1 || value % 5 === 0) {
                                        return value;
                                    }
                                    return '';
                                },
                                color: '#a3a3a3'
                            },
                            grid: { color: '#262626' }
                        },
                        x: {
                            ticks: { color: '#a3a3a3' },
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function closeHistoryModal() { 
            document.getElementById('history-modal').classList.add('hidden'); 
        }
    </script>

    <!-- VIEWS SCRIPT -->
    <script>
        function renderHomePage(container, db) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
                    <h1 class="text-4xl sm:text-6xl font-black uppercase tracking-tight">UK Top Songs</h1>
                </div>
            `;
        }

        function renderChartsOverviewPage(container, db) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
                    <div class="text-center max-w-2xl mx-auto">
                        <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">Charts</h1>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${chartCategories.map(cat => `
                            <a href="#charts/${cat.id}" onclick="router('charts', '${cat.id}')" class="bg-neutral-900 border border-neutral-800 hover:border-neutral-600 p-6 rounded-2xl flex flex-col justify-between transition-all group">
                                <div>
                                    <span class="text-[10px] font-black uppercase text-[#addedc] tracking-wider">${cat.subtitle}</span>
                                    <h3 class="text-xl font-black uppercase text-white mt-1 group-hover:text-[#addedc] transition-colors">${cat.title}</h3>
                                </div>
                                <div class="flex items-center justify-between mt-6 text-xs font-bold text-neutral-400 uppercase">
                                    <span>View Chart</span>
                                    <i class="fa-solid fa-arrow-right text-[#addedc] group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderChartsPage(container, db, activeChartId, selectedDateParam) {
            const currentChart = chartCategories.find(c => c.id === activeChartId) || chartCategories[0];
            const historyObj = db.chartHistory[currentChart.id] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            
            let latestDate = dates[dates.length - 1] || '18/09/2026';
            if (selectedDateParam && historyObj[selectedDateParam]) {
                latestDate = selectedDateParam;
            }

            const currentDatesIndex = dates.indexOf(latestDate);
            const prevDate = currentDatesIndex > 0 ? dates[currentDatesIndex - 1] : (dates.length > 1 && currentDatesIndex === -1 ? dates[dates.length - 2] : null);

            let currentEntries = historyObj[latestDate] || [];
            
            currentEntries = currentEntries.filter(entry => {
                const song = db.songs.find(s => s.id === entry.songId);
                if (!song) return false;
                const titleLower = (song.title || '').trim().toLowerCase();
                const artistLower = (song.artist || '').trim().toLowerCase();
                if (titleLower === 'title' || titleLower === '' || artistLower === 'artist' || artistLower === '') {
                    return false;
                }
                return true;
            });

            currentEntries.sort((a, b) => a.rank - b.rank);

            const [dStr, mStr, yStr] = latestDate.split('/');
            const startDateObj = new Date(`${yStr}-${mStr}-${dStr}`);
            const endDateObj = new Date(startDateObj);
            endDateObj.setDate(startDateObj.getDate() + 6);
            const monthsNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dateRangeText = `${startDateObj.getDate()} ${monthsNames[startDateObj.getMonth()]} ${startDateObj.getFullYear()} – ${endDateObj.getDate()} ${monthsNames[endDateObj.getMonth()]} ${endDateObj.getFullYear()}`;

            const isoDateStr = `${yStr}-${mStr}-${dStr}`;

            container.innerHTML = `
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    
                    <div class="flex justify-center">
                        <div onclick="document.getElementById('native-date-picker').showPicker ? document.getElementById('native-date-picker').showPicker() : document.getElementById('native-date-picker').focus()" class="bg-neutral-900 border border-neutral-800 hover:border-neutral-600 cursor-pointer rounded-full px-5 py-2 w-52 justify-between flex items-center shadow-xl transition-all relative">
                            <button type="button" onclick="event.stopPropagation(); navigateChartDate('${currentChart.id}', -1, '${latestDate}')" class="text-neutral-400 hover:text-white transition-colors"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                            <div class="flex items-center gap-2 text-sky-400 font-bold text-xs">
                                <span>${latestDate}</span>
                                <i class="fa-regular fa-calendar text-xs"></i>
                            </div>
                            <button type="button" onclick="event.stopPropagation(); navigateChartDate('${currentChart.id}', 1, '${latestDate}')" class="text-neutral-400 hover:text-white transition-colors"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            
                            <input type="date" id="native-date-picker" value="${isoDateStr}" onchange="handleDateInputPick('${currentChart.id}', this.value)" class="absolute inset-0 opacity-0 pointer-events-none">
                        </div>
                    </div>

                    <section id="view-charts" class="space-y-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-neutral-900/60 border border-neutral-800/80 p-5 rounded-2xl backdrop-blur-md">
                            <div>
                                <h1 id="active-chart-title" class="text-xl md:text-2xl font-extrabold text-white tracking-tight">${currentChart.title}</h1>
                                <p id="active-chart-desc" class="text-xs text-neutral-400 mt-0.5">${dateRangeText}</p>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-2.5 w-full md:w-auto">
                                <div class="relative w-full sm:w-44">
                                    <select id="main-charts-select" onchange="handleDropdownChange('main', this.value)" class="w-full bg-neutral-900 border border-neutral-700 text-white text-xs font-semibold px-3 py-2 rounded-xl focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                                        <option value="" disabled selected>Main Charts</option>
                                        <option value="top-songs">Top Songs</option>
                                        <option value="top-albums">Top Albums</option>
                                        <option value="top-artists">Top Artists</option>
                                        <option value="greatest-hits">Greatest Hits</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400">
                                        <i class="fa-solid fa-chevron-down text-xs"></i>
                                    </div>
                                </div>

                    <div class="chart-table-header">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div>LW</div>
                        <div>PEAK</div>
                        <div>WEEKS</div>
                        <div>INFO</div>
                    </div>

                    <div class="space-y-2">
                        ${currentEntries.length === 0 ? `
                            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">
                                No chart entries found for this date (${latestDate}). Use the Admin panel to upload or add chart data.
                            </div>
                        ` : currentEntries.map(entry => {
                            const song = db.songs.find(s => s.id === entry.songId) || { title: 'Unknown', artist: 'Unknown', cover: '' };
                            
                            let lwVal = '-';
                            let peakVal = entry.rank;
                            let weeksCount = 0;
                            let bestPeakCount = 1;

                            let rankHistory = [];
                            for (let i = 0; i <= currentDatesIndex && i < dates.length; i++) {
                                const pastDate = dates[i];
                                const match = db.chartHistory[currentChart.id][pastDate].find(e => e.songId === entry.songId);
                                if (match) {
                                    weeksCount++;
                                    rankHistory.push(match.rank);
                                    if (match.rank < peakVal) peakVal = match.rank;
                                }
                            }

                            bestPeakCount = rankHistory.filter(r => r === peakVal).length;
                            const peakDisplay = (peakVal === 1 && bestPeakCount > 1) ? `1×${bestPeakCount}` : `${peakVal}`;

                            let hasPreviousRecord = false;
                            for (let i = 0; i < currentDatesIndex; i++) {
                                const pastDate = dates[i];
                                const matchInPast = db.chartHistory[currentChart.id][pastDate].find(e => e.songId === entry.songId);
                                if (matchInPast) {
                                    hasPreviousRecord = true;
                                    break;
                                }
                            }

                            let trendHTML = '';
                            if (!hasPreviousRecord) {
                                trendHTML = '<span class="text-amber-400 text-[10px] font-black uppercase tracking-wider">NEW</span>';
                            } else {
                                const prevEntriesMap = prevDate ? (historyObj[prevDate] || []).reduce((acc, cur) => { acc[cur.songId] = cur.rank; return acc; }, {}) : {};
                                
                                if (prevDate && prevEntriesMap[entry.songId] !== undefined) {
                                    lwVal = prevEntriesMap[entry.songId];
                                    const diff = lwVal - entry.rank;
                                    if (diff > 0) trendHTML = `<span class="text-emerald-500 text-[10px] font-bold flex items-center justify-center gap-0.5"><i class="fa-solid fa-arrow-up text-[9px]"></i> ${diff}</span>`;
                                    else if (diff < 0) trendHTML = `<span class="text-[#addedc] text-[10px] font-bold flex items-center justify-center gap-0.5"><i class="fa-solid fa-arrow-down text-[9px]"></i> ${Math.abs(diff)}</span>`;
                                    else trendHTML = '<span class="text-neutral-500 font-bold">-</span>';
                                } else {
                                    trendHTML = '<span class="text-purple-400 text-[10px] font-black uppercase tracking-wider">RE</span>';
                                }
                            }

                            return `
                                <div class="chart-row">
                                    <div class="rank-col">
                                        <span class="text-xl font-black text-white block">${entry.rank}</span>
                                        <span class="rank-movement">${trendHTML}</span>
                                    </div>
                                    <div class="song-info-col min-w-0">
                                        <img src="${song.cover}" class="w-10 h-10 rounded-lg object-cover bg-neutral-800 shrink-0" onerror="this.src='https://placehold.co/100x100/222/fff?text=Song'">
                                        <div class="min-w-0">

                                    </div>
                                    <div class="text-center text-xs font-bold text-neutral-300">${lwVal}</div>
                                    <div class="text-center text-xs font-bold text-white">${peakDisplay}</div>
                                    <div class="text-center text-xs font-bold text-neutral-300">${weeksCount}</div>
                                    <div class="text-right flex justify-center">
                                        <button onclick="openHistoryModal('${currentChart.id}', '${entry.songId}', '${song.title.replace(/'/g, "\\'")}')" class="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 inline-flex items-center justify-center text-neutral-400 hover:text-white transition-colors">
                                            <i class="fa-solid fa-info text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}

                </div>
            `;
        }

        function handleCalendarDateSelect(selectedYear, selectedMonth, selectedDay, chartId) {
            const db = getDB();
            const chartHistoryObj = db.chartHistory[chartId] || {};
            const availableDates = Object.keys(chartHistoryObj);

            if (availableDates.length === 0) return;

            const clickedDate = new Date(selectedYear, selectedMonth - 1, selectedDay);

            let closestDate = availableDates[0];
            let smallestDiff = Math.abs(new Date(clickedDate.toISOString().slice(0,10)) - parseChartDate(availableDates[0]));

            availableDates.forEach(dateStr => {
                const chartDateObj = parseChartDate(dateStr);
                const diff = Math.abs(clickedDate - chartDateObj);
                if (diff < smallestDiff) {
                    smallestDiff = diff;
                    closestDate = dateStr;
                }
            });

            router('charts', chartId, closestDate);
        }

        function parseChartDate(dateStr) {
            const [d, m, y] = dateStr.split('/');
            return new Date(`${y}-${m}-${d}`);
        }

        function navigateChartDate(chartId, direction, currentDateStr) {
            const db = getDB();
            const historyObj = db.chartHistory[chartId] || {};
            const dates = Object.keys(historyObj).sort((a,b) => new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-')));
            if (dates.length === 0) return;

            let currentIndex = dates.indexOf(currentDateStr);
            if (currentIndex === -1) currentIndex = dates.length - 1;

            let newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < dates.length) {
                router('charts', chartId, dates[newIndex]);
            }
        }

        function handleDateInputPick(chartId, isoDateValue) {
            if (!isoDateValue) return;
            const parts = isoDateValue.split('-'); 
            handleCalendarDateSelect(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]), chartId);
        }

            const artistSongIds = new Set(artistSongs.map(s => s.id));

            // Calculate overall stats across all chart weeks (primarily Top Songs)
            const trackPeaks = {}; // songId -> best rank
            let weeksNo1 = 0;
            let weeksTop10 = 0;
            let weeksTop50 = 0;
            let weeksTop75 = 0;

            const songsChartHistory = db.chartHistory['top-songs'] || {};
            Object.values(songsChartHistory).forEach(entriesList => {
                entriesList.forEach(entry => {
                    if (artistSongIds.has(entry.songId)) {
                        const r = entry.rank;
                        if (!trackPeaks[entry.songId] || r < trackPeaks[entry.songId]) {
                            trackPeaks[entry.songId] = r;
                        }
                        if (r === 1) weeksNo1++;
                        if (r <= 10) weeksTop10++;
                        if (r <= 50) weeksTop50++;
                        if (r <= 75) weeksTop75++;

            let countNo1s = 0;
            let countTop10s = 0;

            let countTop75s = 0;

            Object.values(trackPeaks).forEach(peak => {

            // Group charted songs by chart category

                        songsInThisChart.push({
                            song,
                            peakDisplay,
                            weeksCount

                            <i class="fa-solid fa-pen"></i> Edit Artist Name

                    <!-- AUTO-CALCULATED ARTIST STATS -->

                    ${chartsWithSongs.length === 0 ? `

        function renderAboutPage(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
                    <div class="text-center max-w-2xl mx-auto">
                        <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">About Us</h1>
                    </div>

                    <div class="text-neutral-300 text-sm leading-relaxed max-w-3xl mx-auto text-center px-4">
                        <p>The UK Top Songs is an unofficial, fan-made version of the Official Charts Company's Official UK Singles Chart, removing the ACR and 3-single rules and instead implementing a recurrency rule, similar to Billboard. The chart was created as a fun project, an alternate way to view the chart. We are not affiliated with OCC. Charts are usually published on a Friday, though this can vary.</p>
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl space-y-6 text-neutral-300 text-sm leading-relaxed">

                                <h2 class="text-xl font-black uppercase text-white tracking-wide">UK TOP SONGS CHART RULES</h2>

                                    <p class="mt-2">Recurrency only occurs if a song declines in position and units.</p>
                                    <p class="mt-2 font-semibold text-white">Recurrency occurs:</p>

                                        <li>When a song falls below #50 with at least 20 weeks on the chart</li>

                                    <ul class="list-disc list-inside space-y-1 mt-1 pl-2">

                                        <li>They hit a new sales peak</li>

                                    <p class="mt-2">This does not extend to artwork on cover arts or music videos, although we will not endorse these either.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

    <script>
        function renderAdminPage(container, db) {
            container.innerHTML = `

                </div>

                <!-- Dynamic Modal Container -->
                <div id="admin-modal-container"></div>
            `;
        }

        function switchAdminTab(tab) {
            const db = getDB();
            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.className = 'admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-neutral-900 text-neutral-400 hover:text-white';
            });
            document.getElementById(`tab-btn-${tab}`).className = 'admin-tab-btn px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider bg-[#addedc] text-black';

            const container = document.getElementById('admin-tab-content');
            if (tab === 'songs') container.innerHTML = renderAdminSongsTab(db);
            if (tab === 'charts') container.innerHTML = renderAdminChartsTab(db);
            if (tab === 'upload') container.innerHTML = renderAdminUploadTab();
        }

        function renderAdminSongsTab(db) {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold uppercase">Master Songs Catalog</h3>
                        <button onclick="openSongModal()" class="bg-[#addedc] text-black px-5 py-2.5 rounded-xl text-xs font-bold uppercase flex items-center gap-2"><i class="fa-solid fa-plus"></i> Add New Song</button>
                    </div>
                    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <tr class="border-b border-neutral-800 text-neutral-400 text-xs uppercase font-bold bg-neutral-900/50">
                                <th class="p-4">Code</th>
                                <th class="p-4">Title & Artists</th>
                                <th class="p-4">Genres</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                            ${db.songs.map(song => `
                                <tr class="border-b border-neutral-800/50 text-sm">
                                    <td class="p-4 font-mono text-neutral-400 text-xs">${song.code}</td>
                                    <td class="p-4 font-bold">${song.title} <span class="block text-xs font-normal text-neutral-400">${song.artist}</span></td>
                                    <td class="p-4">${renderGenreBadges(song)}</td>
                                    <td class="p-4 text-right space-x-2">
                                        <button onclick="openEditSongModal('${song.id}')" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-pen"></i> Edit</button>
                                        <button onclick="deleteSong('${song.id}')" class="bg-red-950 hover:bg-red-900 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
            `;
        }

        function openSongModal(songId = null) {
            const db = getDB();
            let song = { id: '', code: '', title: '', artist: '', genres: ['Pop'], cover: '' };
            let isEdit = false;

            if (songId) {
                const found = db.songs.find(s => s.id === songId);
                if (found) {
                    song = found;
                    isEdit = true;
                }
            } else {
                let nextNum = 1;
                if (db.songs && db.songs.length > 0) {
                    const tsNumbers = db.songs
                        .map(s => s.code)
                        .filter(c => c && c.startsWith('TS-'))
                        .map(c => parseInt(c.replace('TS-', ''), 10))
                        .filter(n => !isNaN(n));
                    
                    if (tsNumbers.length > 0) {
                        nextNum = Math.max(...tsNumbers) + 1;
                    } else {
                        nextNum = db.songs.length + 1;
                    }
                }
                song.code = `TS-${nextNum}`;
            }

            const modalHTML = `
                <div id="song-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center"><h3 class="text-xl font-bold uppercase">${isEdit ? 'Edit Song' : 'Add New Song'}</h3><button onclick="closeSongModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
                        <form onsubmit="handleSongSubmit(event, '${song.id}')" class="space-y-3">
                            <div>
                                <label class="block text-xs uppercase text-neutral-400 mb-1">Song Code (Auto-Assigned)</label>
                                <input type="text" id="song-code-input" value="${song.code}" readonly class="w-full bg-neutral-950 border border-neutral-800 px-4 py-2.5 rounded-xl text-sm text-neutral-400 cursor-not-allowed">
                            </div>
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Song Title</label><input type="text" id="song-title-input" value="${song.title}" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Artists</label><input type="text" id="song-artist-input" value="${song.artist}" placeholder="e.g. Prospa, Cloonee & Tristan Henry" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div>
                                <label class="block text-xs uppercase text-neutral-400 mb-2">Genres (Select multiple)</label>
                                <div id="genresCheckboxContainer" class="grid grid-cols-2 gap-2 bg-black border border-neutral-700 p-3 rounded-xl max-h-40 overflow-y-auto">
                                </div>
                                <div class="custom-genre-wrapper" style="margin-top: 10px; display: flex; gap: 8px;">
                                    <input type="text" id="newGenreInput" placeholder="Add custom genre..." style="flex: 1; padding: 8px 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 12px;">
                                    <button type="button" onclick="addNewGenre()" style="padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;">Add</button>
                                </div>
                            </div>
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">Cover Art URL</label><input type="url" id="song-cover-input" value="${song.cover}" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div class="flex justify-end gap-2 pt-3"><button type="button" onclick="closeSongModal()" class="bg-neutral-800 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold">Save Song</button></div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('admin-modal-container').innerHTML = modalHTML;
            renderGenreCheckboxes(song);
        }

        function renderGenreCheckboxes(song = null) {
            const container = document.getElementById('genresCheckboxContainer');
            if (!container) return;
            const db = getDB();
            const currentSongGenres = song ? getSongGenres(song) : [];

            container.innerHTML = db.genres.map(genre => `
                <label style="display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; font-size: 12px;">
                    <input type="checkbox" name="songGenres" value="${genre}" ${currentSongGenres.includes(genre) ? 'checked' : ''} style="accent-color: #addedc;"> ${genre}
                </label>
            `).join('');
        }

        function addNewGenre() {
            const input = document.getElementById('newGenreInput');
            if (!input) return;
            const genreName = input.value.trim();

            if (!genreName) return;

            const formattedGenre = genreName.charAt(0).toUpperCase() + genreName.slice(1);
            const db = getDB();

            if (!db.genres) {
                db.genres = ['Afrobeats', 'Dance/Electronic', 'Folk/Country', 'Indie/Rock', 'Pop', 'Rap', 'Rnb/Funk'];
            }

            const exists = db.genres.some(g => g.toLowerCase() === formattedGenre.toLowerCase());

            if (!exists) {
                db.genres.push(formattedGenre);
                db.genres.sort();
                saveDB(db);
                renderGenreCheckboxes();
                showToast(`Genre "${formattedGenre}" added to database!`);
            } else {
                showToast('That genre already exists!');
            }

            input.value = '';
        }

        function openEditSongModal(songId) { openSongModal(songId); }
        function closeSongModal() { document.getElementById('admin-modal-container').innerHTML = ''; }

        function handleSongSubmit(e, existingId) {
            e.preventDefault();
            const db = getDB();
            const code = document.getElementById('song-code-input').value;
            const title = document.getElementById('song-title-input').value;
            const artist = document.getElementById('song-artist-input').value;
            
            const selectedGenres = Array.from(document.querySelectorAll('input[name="songGenres"]:checked')).map(cb => cb.value);
            const genres = selectedGenres.length > 0 ? selectedGenres : ['Pop'];

            const cover = document.getElementById('song-cover-input').value || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=80';

            if (existingId) {
                const song = db.songs.find(s => s.id === existingId);
                if (song) {
                    song.code = code;
                    song.title = title;
                    song.artist = artist;
                    song.genres = genres;
                    delete song.genre;
                    song.cover = cover;
                }
                showToast('Song updated successfully!');
            } else {
                const newSong = { id: Date.now().toString(), code, title, artist, genres, cover };
                db.songs.push(newSong);
                showToast('Song added to master catalog!');
            }
            saveDB(db);
            closeSongModal();
            router('admin');
        }

        function deleteSong(songId) {
            if (!confirm('Are you sure you want to delete this song from the master catalog?')) return;
            const db = getDB();
            db.songs = db.songs.filter(s => s.id !== songId);
            saveDB(db);
            showToast('Song deleted.');
            router('admin');
        }

        function openEditArtistModal(oldName) {
            const modalHTML = `
                <div id="artist-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-md w-full p-6 space-y-4">
                        <div class="flex justify-between items-center"><h3 class="text-xl font-bold uppercase">Edit Artist Name</h3><button onclick="closeArtistModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
                        <form onsubmit="handleArtistRename(event, '${oldName.replace(/'/g, "\\'")}')" class="space-y-3">
                            <div><label class="block text-xs uppercase text-neutral-400 mb-1">New Artist Name</label><input type="text" id="new-artist-name" value="${oldName}" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white"></div>
                            <div class="flex justify-end gap-2 pt-3"><button type="button" onclick="closeArtistModal()" class="bg-neutral-800 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold">Update Name</button></div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('admin-modal-container').innerHTML = modalHTML;
        }
        function closeArtistModal() { document.getElementById('admin-modal-container').innerHTML = ''; }

        function handleArtistRename(e, oldName) {
            e.preventDefault();
            const newName = document.getElementById('new-artist-name').value.trim();
            if (!newName) return;
            const db = getDB();

            db.songs.forEach(song => {
                if (song.artist.toLowerCase().includes(oldName.toLowerCase())) {
                    song.artist = song.artist.replace(new RegExp(oldName, 'gi'), newName);
                }
            });

            saveDB(db);
            showToast('Artist name updated across songs catalog!');
            closeArtistModal();
            router('artist', encodeURIComponent(newName));
        }

        function renderAdminChartsTab(db) {
            let allChartWeeks = [];
            Object.keys(db.chartHistory).forEach(catId => {
                Object.keys(db.chartHistory[catId]).forEach(dateStr => {
                    allChartWeeks.push({ catId, dateStr, count: db.chartHistory[catId][dateStr].length });
                });
            });

            return `
                <div class="space-y-6">
                    <h3 class="text-xl font-bold uppercase">Manage Chart History & Entries</h3>
                    <p class="text-sm text-neutral-400">Select a chart week below to review, edit ranks, or delete entries.</p>
                    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <tr class="border-b border-neutral-800 text-neutral-400 text-xs uppercase font-bold bg-neutral-900/50">
                                <th class="p-4">Chart Category</th>
                                <th class="p-4">Chart Date</th>
                                <th class="p-4">Entries Count</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                            ${allChartWeeks.map(item => {
                                const catObj = chartCategories.find(c => c.id === item.catId) || { title: item.catId };
                                return `
                                    <tr class="border-b border-neutral-800/50 text-sm">
                                        <td class="p-4 font-bold text-white">${catObj.title}</td>
                                        <td class="p-4 text-neutral-300 font-mono text-xs">${item.dateStr}</td>
                                        <td class="p-4 text-neutral-400">${item.count} songs</td>
                                        <td class="p-4 text-right space-x-2">
                                            <button onclick="openEditChartWeekModal('${item.catId}', '${item.dateStr}')" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-pen"></i> Edit Ranks</button>
                                            <button onclick="deleteChartWeek('${item.catId}', '${item.dateStr}')" class="bg-red-950 hover:bg-red-900 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </table>
                    </div>
                </div>
            `;
        }

        function openEditChartWeekModal(catId, dateStr) {
            const db = getDB();
            const entries = db.chartHistory[catId]?.[dateStr] || [];
            entries.sort((a,b) => a.rank - b.rank);

            const modalHTML = `
                <div id="chart-week-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
                        <div class="flex justify-between items-center shrink-0">
                            <div>
                                <h3 class="text-xl font-bold uppercase">Edit Chart Week</h3>
                                <p class="text-xs text-neutral-400">${catId} — ${dateStr}</p>
                            </div>
                            <button onclick="closeChartWeekModal()"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div class="space-y-2 overflow-y-auto flex-grow pr-2">
                            ${entries.map((entry, idx) => {
                                const song = db.songs.find(s => s.id === entry.songId) || { title: 'Unknown Song', artist: 'Unknown' };
                                return `
                                    <div class="bg-black/50 border border-neutral-800 p-3 rounded-xl flex items-center justify-between gap-3">
                                        <div class="min-w-0 flex-grow">
                                            <h4 class="font-bold text-sm truncate text-white">${song.title}</h4>
                                            <p class="text-xs text-neutral-400 truncate">${song.artist}</p>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <label class="text-[10px] uppercase text-neutral-400">Rank:</label>
                                            <input type="number" id="rank-input-${entry.songId}" value="${entry.rank}" min="1" class="w-16 bg-neutral-900 border border-neutral-700 px-2 py-1 rounded text-center text-sm text-white font-bold">
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="flex justify-end gap-2 pt-3 shrink-0 border-t border-neutral-800">
                            <button type="button" onclick="closeChartWeekModal()" class="bg-neutral-800 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button>
                            <button type="button" onclick="saveChartWeekRanks('${catId}', '${dateStr}')" class="bg-[#addedc] text-black px-5 py-2 rounded-xl text-xs font-bold">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('admin-modal-container').innerHTML = modalHTML;
        }

        function closeChartWeekModal() { document.getElementById('admin-modal-container').innerHTML = ''; }

        function saveChartWeekRanks(catId, dateStr) {
            const db = getDB();
            const entries = db.chartHistory[catId]?.[dateStr] || [];

            entries.forEach(entry => {
                const inputEl = document.getElementById(`rank-input-${entry.songId}`);
                if (inputEl) {
                    const newRank = parseInt(inputEl.value);
                    if (!isNaN(newRank)) {
                        entry.rank = newRank;
                    }
                }
            });

            saveDB(db);
            showToast('Chart week ranks updated!');
            closeChartWeekModal();
            router('admin');
        }

        function deleteChartWeek(catId, dateStr) {
            if (!confirm(`Are you sure you want to delete the entire chart for ${dateStr}?`)) return;
            const db = getDB();
            if (db.chartHistory[catId]) {
                delete db.chartHistory[catId][dateStr];
            }
            saveDB(db);
            showToast('Chart week deleted.');
            router('admin');
        }

        function renderAdminUploadTab() {
            return `
                <div class="space-y-6 max-w-xl">
                    <h3 class="text-xl font-bold uppercase">Upload Weekly Chart CSV</h3>
                    <p class="text-sm text-neutral-400">Upload a CSV file containing columns: <code>rank</code>, <code>title</code>, <code>artist</code>, <code>sales_increase</code> (true/false).</p>
                    
                    <form onsubmit="handleCSVUpload(event)" class="space-y-4 bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
                        <div>
                            <label class="block text-xs uppercase text-neutral-400 mb-1">Select Chart Category</label>
                            <select id="csv-chart-category" class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white">
                                ${chartCategories.map(c => `<option value="${c.id}">${c.title}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-neutral-400 mb-1">Chart Week Date (DD/MM/YYYY)</label>
                            <input type="text" id="csv-chart-date" placeholder="25/09/2026" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-neutral-400 mb-1">CSV File</label>
                            <input type="file" id="csv-file-input" accept=".csv" required class="w-full bg-black border border-neutral-700 px-4 py-2.5 rounded-xl text-sm text-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#addedc] file:text-black hover:file:bg-[#bde1ee]">
                        </div>
                        <button type="submit" class="w-full bg-[#addedc] hover:bg-[#bde1ee] text-black py-3 rounded-xl font-bold text-sm uppercase transition-colors">Process & Import Chart</button>
                    </form>
                </div>
            `;
        }

        function handleCSVUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('csv-file-input');
            const categoryId = document.getElementById('csv-chart-category').value;
            const chartDate = document.getElementById('csv-chart-date').value.trim();

            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                const db = getDB();

                if (!db.chartHistory[categoryId]) db.chartHistory[categoryId] = {};
                const weekEntries = [];

                for (let i = 0; i < lines.length; i++) {
                    const lineLower = lines[i].toLowerCase();
                    if (lineLower.includes('rank') || lineLower.includes('title') || lineLower.includes('artist') || lineLower.includes('code')) {
                        continue;
                    }

                    const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    if (cols.length < 2) continue;

                    const rank = parseInt(cols[0]);
                    if (isNaN(rank)) continue;

                    const title = cols[1];
                    const artist = cols[2] || 'Unknown Artist';
                    const salesIncrease = cols[3] ? cols[3].toLowerCase() === 'true' : false;

                    let foundSong = db.songs.find(s => s.title.toLowerCase() === title.toLowerCase());
                    let songId;

                    if (!foundSong) {
                        songId = 'song_' + Date.now() + '_' + i;
                        db.songs.push({
                            id: songId,
                            code: 'NEW-' + Math.floor(100 + Math.random() * 900),
                            title: title,
                            artist: artist,
                            genres: ['Pop'],
                            cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=80'
                        });
                    } else {
                        songId = foundSong.id;
                    }

                    weekEntries.push({ songId, rank, salesIncrease });
                }

                db.chartHistory[categoryId][chartDate] = weekEntries;
                saveDB(db);
                showToast('Weekly chart successfully imported from CSV!');
                router('charts', categoryId, chartDate);
            };
            reader.readAsText(file);
        }

        function handleDropdownChange(type, value) {
            if (type === 'main') {
                const genreSelect = document.getElementById('genre-charts-select');
                if (genreSelect) genreSelect.selectedIndex = 0;
            } else {
                const mainSelect = document.getElementById('main-charts-select');
                if (mainSelect) mainSelect.selectedIndex = 0;
            }
            
            router('charts', value);
        }
    </script>
</body>
</html>
