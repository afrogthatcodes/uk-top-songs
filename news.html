<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
<header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
        <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-neutral-300 hover:text-[#addedc]">Artists</a>
                <a href="news.html" class="text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8 w-full">
        <div class="text-center max-w-2xl mx-auto">
            <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">Latest News</h1>
        </div>
        <div id="news-container" class="space-y-4"></div>
    </main>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const container = document.getElementById('news-container');

        if (!db.news || db.news.length === 0) {
            container.innerHTML = `<div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">No news articles found.</div>`;
        } else {
            container.innerHTML = db.news.map(n => `
                <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center text-xs text-neutral-400">
                        <span class="bg-[#addedc] text-black font-bold px-2.5 py-0.5 rounded-md uppercase text-[10px]">${n.category || 'Latest News'}</span>
                        <span class="font-mono">${n.date}</span>
                    </div>
                    <h3 class="font-bold text-lg text-white">${n.title}</h3>
                    <p class="text-sm text-neutral-300 leading-relaxed">${n.content}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
