<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - Latest News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="charts.html" class="text-neutral-300 hover:text-[#addedc]">Charts</a>
                <a href="artists.html" class="text-neutral-300 hover:text-[#addedc]">Artists</a>
                <a href="news.html" class="text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-[#addedc]">About Us</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full space-y-10">
        <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight text-center">Latest News</h1>

        <div id="news-list-container" class="space-y-6"></div>
    </main>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof fetchDBAsync === 'function') {
                await fetchDBAsync();
            }
            const db = getDB();
            const container = document.getElementById('news-list-container');
            const newsItems = db.news || [];

            if (newsItems.length === 0) {
                container.innerHTML = `<div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center text-neutral-500">No news articles published yet.</div>`;
                return;
            }

            container.innerHTML = newsItems.map(item => `
                <a href="article.html?id=${encodeURIComponent(item.id)}" class="block bg-neutral-900/60 border border-neutral-800 hover:border-[#addedc] rounded-2xl p-6 sm:p-8 transition-all group">
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <span class="bg-[#addedc] text-black text-[10px] font-black uppercase px-3 py-1 rounded-md tracking-wider">${item.category}</span>
                        <span class="font-mono text-xs text-neutral-400">${item.date}</span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-white group-hover:text-[#addedc] transition-colors mb-3">${item.title}</h2>
                    <p class="text-sm text-neutral-300 leading-relaxed line-clamp-3 mb-4">${item.content}</p>
                    <div class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-[#addedc]">
                        <span>Read Full Article</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </a>
            `).join('');
        });
    </script>
</body>
</html>
