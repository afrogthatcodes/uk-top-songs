<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK TOP SONGS - News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Albert Sans', sans-serif; background-color: #000000; color: #ffffff; }</style>
</head>
<body class="min-h-full flex flex-col antialiased">
    <header class="bg-black border-b border-neutral-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl sm:text-2xl font-black tracking-widest uppercase hover:text-[#addedc]">UK TOP SONGS</a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-semibold tracking-wider uppercase">
                <a href="index.html" class="text-neutral-300 hover:text-white">Home</a>
                <a href="charts.html" class="text-neutral-300 hover:text-white">Charts</a>
                <a href="news.html" class="text-white">News</a>
                <a href="about.html" class="text-neutral-300 hover:text-white">About Us</a>
                <a href="admin.html" class="text-[#addedc]">Admin</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
        <div class="text-center max-w-2xl mx-auto">
            <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">Latest News</h1>
        </div>
        <div id="news-container" class="space-y-4 max-w-3xl mx-auto"></div>
    </main>

    <footer class="bg-black border-t border-neutral-900 pt-16 pb-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-neutral-500 text-xs">Thank you for visiting :)</div>
    </footer>

    <script src="script.js"></script>
    <script>
        const db = getDB();
        const container = document.getElementById('news-container');
        container.innerHTML = db.news.map(n => `
            <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
                <h3 class="font-bold text-lg text-white">${n.title}</h3>
                <p class="text-sm text-neutral-400 mt-2">${n.content}</p>
            </div>
        `).join('');
    </script>
</body>
</html>
